<script>
"use strict";
const TEAMS=[
{id:"tigers",name:"阪神タイガース",league:"セ",city:"兵庫",power:84},{id:"carp",name:"広島東洋カープ",league:"セ",city:"広島",power:74},{id:"baystars",name:"横浜DeNAベイスターズ",league:"セ",city:"神奈川",power:80},{id:"giants",name:"読売ジャイアンツ",league:"セ",city:"東京",power:82},{id:"swallows",name:"東京ヤクルトスワローズ",league:"セ",city:"東京",power:72},{id:"dragons",name:"中日ドラゴンズ",league:"セ",city:"愛知",power:70},
{id:"hawks",name:"福岡ソフトバンクホークス",league:"パ",city:"福岡",power:86},{id:"fighters",name:"北海道日本ハムファイターズ",league:"パ",city:"北海道",power:81},{id:"marines",name:"千葉ロッテマリーンズ",league:"パ",city:"千葉",power:76},{id:"eagles",name:"東北楽天ゴールデンイーグルス",league:"パ",city:"宮城",power:71},{id:"buffaloes",name:"オリックス・バファローズ",league:"パ",city:"大阪",power:79},{id:"lions",name:"埼玉西武ライオンズ",league:"パ",city:"埼玉",power:68}];
const SAVE_KEY="pennant_manager_next_v4";
const OLD_SAVE_KEY="pennant_manager_next_v3"; let state=null,selectedTeam=TEAMS[0].id;
const $=id=>document.getElementById(id),team=id=>TEAMS.find(t=>t.id===id),clone=x=>JSON.parse(JSON.stringify(x));
window.selectedPlayer=null;
function dateStr(dt){const w=["日","月","火","水","木","金","土"];return `${dt.getUTCFullYear()}/${String(dt.getUTCMonth()+1).padStart(2,"0")}/${String(dt.getUTCDate()).padStart(2,"0")}（${w[dt.getUTCDay()]}）`}
function ageAt(birth,year){return year-Number(birth.slice(0,4));}
function clamp100(v){return Math.max(1,Math.min(100,Math.round(v)));}
function rankOf(v){v=clamp100(v);if(v>=90)return "S";if(v>=80)return "A";if(v>=70)return "B";if(v>=60)return "C";if(v>=50)return "D";if(v>=40)return "E";if(v>=20)return "F";return "G";}
function rankClass(v){return "rank-"+rankOf(v).toLowerCase();}
function ability(v){v=clamp100(v);return `<span class="ability ${rankClass(v)}"><b>${rankOf(v)}</b><small>${v}</small></span>`;}
function overall(p){
  if(p.pos==="P") return clamp100((p.velocity-120)*0.9 + p.control*0.35 + p.stamina*0.3 + (p.velocity>=150?8:0));
  return clamp100(p.contact*.27+p.power*.24+p.speed*.13+p.def*.16+p.arm*.10+(p.catching||50)*.10+(p.trajectory||2)*2);
}
const NAMES=["青木","石川","伊藤","井上","岡田","加藤","木村","久保","小川","佐々木","高橋","田中","中村","西村","藤井","松本","森","山口","山田","吉田","渡辺","佐藤","鈴木","山本","小林","斎藤","清水","阿部","池田","後藤","近藤","前田","村上","林","橋本","柴田","原","宮本","横山","長谷川","福田","金子","藤田","岡本","中島","中川","石井","遠藤"];
function makePlayer(id,tm,i,pos){
  let age=20+(i*7+tm.length)%17;
  let seed=(i*17+tm.length*13)%41;
  let base=clamp100(45+seed+(pos==="P"?0:5));
  let contact=clamp100(62+((i*11+tm.length)%30));
  let power=clamp100(48+seed+(i%5)*4);
  let speed=clamp100(45+((i*9+seed)%45));
  let def=clamp100(45+((i*13+seed)%45));
  let arm=clamp100(45+((i*7+seed)%45));
  let catching=clamp100(42+((i*15+seed)%48));
  let talent=clamp100(45+((i*19+tm.length)%51));
  return {
    id:`${tm}_${i}`,teamId:tm,name:NAMES[(i+tm.length)%NAMES.length]+(i%4?"":"Jr."),number:10+i,age,pos,
    bats:i%3===0?"左":"右",throws:i%4===0?"左":"右",
    contact:pos==="P"?0:contact,power:pos==="P"?0:power,speed:pos==="P"?0:speed,def:pos==="P"?0:def,arm:pos==="P"?0:arm,catching:pos==="P"?0:catching,trajectory:pos==="P"?0:1+(i%4),
    talent,stamina:pos==="P"?clamp100(55+seed%35):0,control:pos==="P"?clamp100(50+((i*5)%40)):0,velocity:pos==="P"?140+seed%11:0,
    era:0,ip:0,hits:0,hr:0,rbi:0,avg:0,so:0,wins:0,saves:0,role:pos==="P"?(i<5?"SP":"RP"):"BENCH",
    active:true,minor:i>=21,fatigue:0,form:50+((i*13)%41),injury:null,injuryDays:0,development:talent>=75?"高成長":talent>=60?"普通":"低成長",potential:talent,retired:false,
    special: pos==="P" ? ["対ピンチ","ノビ","回復"] : ["チャンス","対左投手","ケガしにくさ"]
  };
}
function makeRoster(tm){let ps=[];for(let i=0;i<30;i++){let pos=i<12?"P":i===12?"C":i<17?"IF":i<21?"OF":"IF";ps.push(makePlayer(tm.id,tm.id,i,pos));}return ps;}
function freshState(control){let teams={};TEAMS.forEach(t=>teams[t.id]={id:t.id,wins:0,losses:0,ties:0,runsFor:0,runsAgainst:0,streak:"-"});let players=[];TEAMS.forEach(t=>players.push(...makeRoster(t)));return {version:4,year:2026,currentDate:"2026-03-27T00:00:00Z",phase:"regular",controlTeam:control,teams,players,games:[],generated:false,lastMessage:"ゲームを開始しました。",lineups:{},rotation:{},seasonStats:{}};}
function schedule(){const games=[],start=new Date("2026-03-27T00:00:00Z"),end=new Date("2026-10-04T00:00:00Z");for(let dt=new Date(start);dt<=end;dt.setUTCDate(dt.getUTCDate()+1)){if(dt.getUTCDay()===1)continue;let d=dt.toISOString().slice(0,10),r=Math.floor((dt-start)/86400000);for(const l of ["セ","パ"]){let ids=TEAMS.filter(t=>t.league===l).map(t=>t.id);let shift=(r*3+(l==="パ"?2:0))%ids.length;let used=new Set();for(let k=0;k<3;k++){let a=ids[(shift+k*2)%ids.length],b=ids[(shift+k*2+1)%ids.length];if(a===b||used.has(a)||used.has(b))continue;used.add(a);used.add(b);let home=(r+k)%2?b:a,away=home===a?b:a;games.push({date:d,home,away,played:false,homeScore:null,awayScore:null});}}}let open=[["tigers","giants"],["carp","baystars"],["swallows","dragons"],["hawks","marines"],["fighters","eagles"],["buffaloes","lions"]];return games.filter(g=>g.date!=="2026-03-27").concat(open.map(x=>({date:"2026-03-27",home:x[0],away:x[1],played:false,homeScore:null,awayScore:null}))).sort((a,b)=>a.date.localeCompare(b.date));}
function ensureSchedule(){if(!state.generated){state.games=schedule();state.generated=true;initializeLineups();}}
function initializeLineups(){TEAMS.forEach(t=>{let ps=state.players.filter(p=>p.teamId===t.id);let hitters=ps.filter(p=>p.pos!=="P").sort((a,b)=>(b.contact+b.power)-(a.contact+a.power));let pitchers=ps.filter(p=>p.pos==="P");state.lineups[t.id]=hitters.slice(0,9).map(p=>p.id);state.rotation[t.id]=pitchers.slice(0,5).map(p=>p.id);});}
function playerById(id){return state.players.find(p=>p.id===id)}
function rating(p){return overall(p);}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function calcTeamPower(id){let lineup=(state.lineups[id]||[]).map(playerById).filter(Boolean),rot=(state.rotation[id]||[]).map(playerById).filter(Boolean);let bat=lineup.reduce((s,p)=>s+p.contact*.45+p.power*.35+p.speed*.1+p.def*.1,0)/Math.max(1,lineup.length);let pit=rot.reduce((s,p)=>s+(p.velocity-130)*2+p.control*.5+p.stamina*.3,0)/Math.max(1,rot.length);return bat+pit*.65}
function conditionMultiplier(p){return .78 + p.form/180 - p.fatigue/250;}
function calcTeamPower(id){let lineup=(state.lineups[id]||[]).map(playerById).filter(p=>p&&!p.minor&&!p.injury),rot=(state.rotation[id]||[]).map(playerById).filter(p=>p&&!p.minor&&!p.injury);let bat=lineup.reduce((s,p)=>s+(p.contact*.45+p.power*.35+p.speed*.1+p.def*.1)*conditionMultiplier(p),0)/Math.max(1,lineup.length);let pit=rot.reduce((s,p)=>s+((p.velocity-130)*2+p.control*.5+p.stamina*.3)*conditionMultiplier(p),0)/Math.max(1,rot.length);return bat+pit*.65;}
function playGame(g){let hp=calcTeamPower(g.home),ap=calcTeamPower(g.away),diff=(hp-ap)/20+1;let hs=Math.max(0,Math.min(15,Math.round(3+diff+gauss()*2))),as=Math.max(0,Math.min(15,Math.round(3-diff*.7+gauss()*2)));if(hs===as){if(Math.random()<.5)hs++;else as++;}g.played=true;g.homeScore=hs;g.awayScore=as;let H=state.teams[g.home],A=state.teams[g.away];H.runsFor+=hs;H.runsAgainst+=as;A.runsFor+=as;A.runsAgainst+=hs;if(hs>as){H.wins++;A.losses++;H.streak="W";A.streak="L"}else{A.wins++;H.losses++;A.streak="W";H.streak="L"}updatePlayerStats(g);applyGameCondition(g);}
function updatePlayerStats(g){for(const id of [...(state.lineups[g.home]||[]),...(state.lineups[g.away]||[])]){let p=playerById(id);if(!p||p.minor||p.injury)continue;let pa=3+Math.random()*2,h=Math.max(0,Math.round(pa*(p.contact/100)*(.55+Math.random()*.55)*conditionMultiplier(p)));p.hits+=h;p.hr+=Math.random()<p.power/250&&h>0?1:0;p.rbi+=Math.max(0,Math.round(h*.55));let games=state.games.filter(x=>x.played&&(x.home===p.teamId||x.away===p.teamId)).length;p.avg=p.hits/Math.max(1,Math.round(games*3.8));if(p.pos==="P"){p.ip+=5+Math.random()*2;p.so+=Math.max(0,Math.round((p.velocity-130)*.7+Math.random()*3));if(Math.random()<.08)p.wins++;p.era=Math.max(.5,5.2-(p.control-50)*.035-(p.velocity-140)*.15+Math.random()*1.4);}}}
function applyGameCondition(g){let ids=[...(state.lineups[g.home]||[]),...(state.lineups[g.away]||[])];ids.forEach(id=>{let p=playerById(id);if(!p||p.minor||p.injury)return;p.fatigue=Math.min(100,p.fatigue+8+Math.floor(Math.random()*7));p.form=Math.max(1,Math.min(100,p.form+Math.floor(Math.random()*11)-5));if(Math.random()<.008){p.injury=Math.random()<.55?"軽傷":"負傷";p.injuryDays=p.injury==="軽傷"?3+Math.floor(Math.random()*5):10+Math.floor(Math.random()*21);p.active=false;}});}
function recoverAndDevelop(){state.players.forEach(p=>{if(p.injuryDays>0){p.injuryDays--;if(p.injuryDays<=0){p.injury=null;p.active=true;}}p.fatigue=Math.max(0,p.fatigue-(p.minor?7:4));p.form=Math.max(1,Math.min(100,p.form+(50-p.form)*.08));if(Math.random()>=.045)return;let growth=p.development==="高成長"?2:p.development==="普通"?1:1;let delta=Math.random()<.55?growth:-growth;if(p.age<=28){if(p.pos==="P"){p.control=Math.max(30,Math.min(95,p.control+delta));p.stamina=Math.max(35,Math.min(95,p.stamina+delta));if(Math.random()<.35)p.velocity=Math.max(135,Math.min(160,p.velocity+delta));}else{p.contact=Math.max(30,Math.min(95,p.contact+delta));p.power=Math.max(30,Math.min(95,p.power+delta));p.def=Math.max(30,Math.min(95,p.def+delta));}}else if(p.age>=31){if(p.pos==="P"){if(Math.random()<.3)p.velocity=Math.max(130,p.velocity-1);p.control=Math.max(30,p.control-(delta>0?0:1));}else{if(Math.random()<.5)p.speed=Math.max(25,p.speed-1);if(Math.random()<.4)p.def=Math.max(25,p.def-1);}}});}
function gamesOn(d){return state.games.filter(g=>g.date===d)}
function advanceDay(){ensureSchedule();recoverAndDevelop();let d=state.currentDate.slice(0,10),gs=gamesOn(d);gs.filter(g=>!g.played).forEach(playGame);let dt=new Date(state.currentDate);dt.setUTCDate(dt.getUTCDate()+1);state.currentDate=dt.toISOString();state.lastMessage=gs.length?`${gs.length}試合をシミュレートしました。`:`${dateStr(new Date(state.currentDate))}は移動日です。`;renderGame("schedule")}
function nextGame(){ensureSchedule();let dt=new Date(state.currentDate);for(let i=0;i<40;i++){dt.setUTCDate(dt.getUTCDate()+1);if(gamesOn(dt.toISOString().slice(0,10)).length){state.currentDate=dt.toISOString();break}}renderGame("schedule")}
function standings(l){return TEAMS.filter(t=>t.league===l).map(t=>({...t,...state.teams[t.id]})).sort((a,b)=>b.wins-a.wins||a.losses-b.losses)}
function save(slot){localStorage.setItem(SAVE_KEY+slot,JSON.stringify(state));state.lastMessage=`セーブ${slot}に保存しました。`;renderGame("save")}
function migrateState(x){
  if(!x)return null;
  if(!x.version||x.version<4){
    x.version=4;x.seasonStats=x.seasonStats||{};
    (x.players||[]).forEach(p=>{p.catching=p.catching||50;p.trajectory=p.trajectory||2;p.special=p.special||["チャンス","対左投手","ケガしにくさ"];p.contact=clamp100(p.contact||50);p.power=clamp100(p.power||50);p.speed=clamp100(p.speed||50);p.def=clamp100(p.def||50);p.arm=clamp100(p.arm||50);if(p.control)p.control=clamp100(p.control);if(p.stamina)p.stamina=clamp100(p.stamina);});
  }
  return x;
}
function load(slot){let x=localStorage.getItem(SAVE_KEY+slot)||localStorage.getItem(OLD_SAVE_KEY+slot);if(!x)return alert("データがありません。");try{state=migrateState(JSON.parse(x));}catch(e){alert("セーブデータを読み込めませんでした。");return}renderGame("schedule")}
function renderTitle(){$("app").innerHTML=`<div class="title screen"><div class="title-box"><h2>PENNANT MANAGER</h2><p>ブラウザ型ペナントゲーム / Phase 4</p><div class="actions"><button class="primary" onclick="newGame()">はじめから</button><button onclick="loadScreen()">つづきから</button></div></div></div>`}
function newGame(){$("app").innerHTML=`<header><h1>球団選択</h1><small>操作球団を選択</small></header><div class="screen"><div class="team-grid">${TEAMS.map(t=>`<button class="team-card ${selectedTeam===t.id?"selected":""}" onclick="selectedTeam='${t.id}';newGame()"><strong>${t.name}</strong><span>${t.league} / ${t.city}</span></button>`).join("")}</div><div class="actions"><button onclick="renderTitle()">戻る</button><button class="primary" onclick="startGame()">この球団で開始</button></div></div>`}
function startGame(){state=freshState(selectedTeam);ensureSchedule();renderGame("schedule")}
function loadScreen(){$("app").innerHTML=`<header><h1>つづきから</h1></header><div class="screen panel">${[1,2,3,4,5].map(s=>{let x=localStorage.getItem(SAVE_KEY+s)||localStorage.getItem(OLD_SAVE_KEY+s),label="空き";if(x){try{let z=JSON.parse(x);label=`${z.currentDate.slice(0,10)} / ${team(z.controlTeam).name}`}catch(e){}}return `<div class="match"><div>セーブ${s}<br><span class="small">${label}</span></div>${x?`<button onclick="load(${s})">ロード</button>`:`<button disabled>空き</button>`}</div>`}).join("")}<div class="actions" style="margin-top:16px"><button onclick="renderTitle()">戻る</button></div></div>`}
function nav(a){return `<div class="main-nav"><button class="${a==="schedule"?"active":""}" onclick="renderGame('schedule')">日程表</button><button class="${a==="players"?"active":""}" onclick="renderGame('players')">選手</button><button class="${a==="lineup"?"active":""}" onclick="renderGame('lineup')">采配</button><button class="${a==="newstrength"?"active":""}" onclick="renderGame('newstrength')">新戦力</button><button class="${a==="teaminfo"?"active":""}" onclick="renderGame('teaminfo')">球団情報</button><button class="${a==="save"?"active":""}" onclick="renderGame('save')">セーブ</button><button onclick="renderTitle()">タイトル画面に戻る</button></div>`}
function renderGame(a="schedule"){ensureSchedule();let ct=team(state.controlTeam);let phaseText=state.phase==="regular"?"レギュラーシーズン":"オフシーズン";$('app').innerHTML=`<header class="game-header"><div class="brand"><div class="brand-mark">PM</div><div><h1>${ct.name}</h1><small>${state.year}　${phaseText}</small></div></div><div class="header-date"><small>GAME DATE</small><b>${dateStr(new Date(state.currentDate))}</b></div></header><div class="screen"><div class="season-ribbon"><span>${phaseText}</span><b>${dateStr(new Date(state.currentDate))}</b><span>操作球団：${ct.name}</span></div>${nav(a)}<div style="margin:14px 0"><div class="notice">${state.lastMessage}</div></div>${a==="schedule"?scheduleView():a==="players"?playersView():a==="lineup"?lineupView():a==="standings"?standingsView():a==="newstrength"?newStrengthView():a==="teaminfo"?teamInfoView():saveView()}</div><footer>PAWA-PENNANT INSPIRED / Phase 4</footer>`;if(a==="players"&&window.selectedPlayer)showPlayer(window.selectedPlayer)}

function scheduleView(){let d=state.currentDate.slice(0,10),today=gamesOn(d),up=state.games.filter(g=>!g.played&&g.date>=d).slice(0,14);return `<div class="grid2"><div class="panel"><h3>本日の試合</h3>${today.length?today.map(g=>`<div class="match"><div class="teams"><b>${team(g.away).name}</b> vs <b>${team(g.home).name}</b></div><div class="score">${g.played?`${g.awayScore} - ${g.homeScore}`:"-"}</div></div>`).join(""):"<p class=small>試合はありません。</p>"}<div class="roster-actions"><button class="primary" onclick="advanceDay()">次の日へ</button><button onclick="nextGame()">次の試合日へ</button></div></div><div class="panel"><h3>今後の日程</h3>${up.map(g=>`<div class="match"><div><span class=small>${g.date}</span><br>${team(g.away).name} vs ${team(g.home).name}</div></div>`).join("")}</div></div>`}
function playersView(){
  let ps=state.players.filter(p=>p.teamId===state.controlTeam),q=window.playerFilter||"ALL";
  let shown=(q==="ALL"?ps:ps.filter(p=>p.pos===q)).sort((a,b)=>overall(b)-overall(a));
  return `<div class="player-layout">
    <div class="panel player-list-panel"><div class="section-head"><div><h2>選手能力</h2><small>能力値は1～100 / ランクはG～S</small></div><span class="system-tag">PENNANT DATA</span></div>
      <div class="filters">${["ALL","P","C","IF","OF"].map(x=>`<button class="filter-btn ${q===x?"selected":""}" onclick="playerFilter='${x}';renderGame('players')">${x==="ALL"?"全選手":x}</button>`).join("")}</div>
      <table class="player-table"><thead><tr><th>背番</th><th>選手</th><th>守備</th><th>年齢</th><th>総合</th><th>能力</th><th>状態</th></tr></thead><tbody>
      ${shown.map(p=>`<tr class="clickrow ${window.selectedPlayer===p.id?"selected-row":""}" onclick="selectedPlayer='${p.id}';showPlayer('${p.id}')">
        <td>${p.number}</td><td><b>${p.name}</b><br><span class="small">${p.bats}打 / ${p.throws}投</span></td><td><span class="pos-badge">${p.pos}</span></td><td>${p.age}</td><td>${ability(overall(p))}</td><td>${p.pos==="P"?`制${ability(p.control)} ス${ability(p.stamina)}`:`ミ${ability(p.contact)} パ${ability(p.power)}`}</td><td>${p.injury?`<span class="status-danger">${p.injury} ${p.injuryDays}日</span>`:`<span class="team-state">${p.minor?"二軍":"一軍"}</span> <span class="small">疲${p.fatigue} 調${p.form}</span>`}</td>
      </tr>`).join("")}
      </tbody></table></div>
    <div class="panel player-detail-panel" id="playerDetail"><div class="detail-empty">選手を選択してください。</div></div>
  </div>`;
}
function showPlayer(id){
  let p=playerById(id),box=$("playerDetail");if(!box)return;window.selectedPlayer=id;
  let stateText=p.injury?`<span class="status-danger">${p.injury}（残り${p.injuryDays}日）</span>`:`<span class="team-state">${p.minor?"二軍":"一軍"}</span>`;
  let header=`<div class="detail-title"><div><div class="player-number">${p.number}</div><div><h2>${p.name}</h2><p>${p.age}歳　${p.pos}　${p.bats}打${p.throws}投　${stateText}</p></div></div><div class="overall-card">${ability(overall(p))}<span>総合</span></div></div>`;
  let common=`<div class="mini-stats"><div><small>疲労</small><b>${p.fatigue}</b></div><div><small>調子</small><b>${p.form}</b></div><div><small>潜在</small><b>${p.potential}</b></div><div><small>成長</small><b>${p.development}</b></div></div>`;
  if(p.pos==="P") box.innerHTML=header+common+`<div class="ability-block"><h3>投手能力</h3><div class="ability-grid two">
    <div class="ability-cell"><span>球速</span><b class="raw-stat">${p.velocity}<small>km/h</small></b></div>
    <div class="ability-cell"><span>コントロール</span>${ability(p.control)}</div>
    <div class="ability-cell"><span>スタミナ</span>${ability(p.stamina)}</div>
  </div><div class="special-box"><h3>変化球・特殊能力</h3><div class="special-chips">${p.special.map(x=>`<span>${x}</span>`).join("")}<span>ストレート</span><span>カーブ</span></div></div></div><h3 class="subhead">今季成績</h3><div class="statline large"><div class="statbox"><b>${p.wins}</b><span>勝利</span></div><div class="statbox"><b>${p.era.toFixed(2)}</b><span>防御率</span></div><div class="statbox"><b>${p.ip.toFixed(1)}</b><span>投球回</span></div><div class="statbox"><b>${p.so}</b><span>奪三振</span></div></div>`;
  else box.innerHTML=header+common+`<div class="ability-block"><h3>野手能力</h3><div class="ability-grid three">
    <div class="ability-cell"><span>ミート</span>${ability(p.contact)}</div><div class="ability-cell"><span>パワー</span>${ability(p.power)}</div><div class="ability-cell"><span>走力</span>${ability(p.speed)}</div>
    <div class="ability-cell"><span>肩力</span>${ability(p.arm)}</div><div class="ability-cell"><span>守備力</span>${ability(p.def)}</div><div class="ability-cell"><span>捕球</span>${ability(p.catching)}</div>
  </div><div class="trajectory"><span>弾道</span>${[1,2,3,4].map(x=>`<i class="${x<=p.trajectory?"on":""}"></i>`).join("")}<b>${p.trajectory}</b></div><div class="special-box"><h3>特殊能力</h3><div class="special-chips">${p.special.map(x=>`<span>${x}</span>`).join("")}</div></div></div><h3 class="subhead">今季成績</h3><div class="statline large"><div class="statbox"><b>${p.avg.toFixed(3)}</b><span>打率</span></div><div class="statbox"><b>${p.hits}</b><span>安打</span></div><div class="statbox"><b>${p.hr}</b><span>本塁打</span></div><div class="statbox"><b>${p.rbi}</b><span>打点</span></div></div>`;
}
function lineupView(){let id=state.controlTeam,order=(state.lineups[id]||[]).map(playerById).filter(Boolean),rot=(state.rotation[id]||[]).map(playerById).filter(Boolean);let bench=state.players.filter(p=>p.teamId===id&&p.minor);return `<div class="grid2"><div class="panel"><h3>スターティングラインナップ</h3><ol class=depth-list>${order.map((p,i)=>`<li><b>${i+1}番</b>　${p.name} <span class=pos>${p.pos}</span>　<span class=small>疲${p.fatigue} 調${p.form}</span></li>`).join("")}</ol><div class=roster-actions><button onclick="autoLineup()">自動編成</button></div><h3 style="margin-top:18px">一軍・二軍</h3><p class=small>二軍選手：${bench.length}人</p><div class=roster-actions>${bench.slice(0,8).map(p=>`<button onclick="promote('${p.id}')">${p.name} 一軍昇格</button>`).join("")}</div></div><div class="panel"><h3>先発ローテーション</h3><ol class=depth-list>${rot.map((p,i)=>`<li>${i+1}　${p.name}　${p.velocity}km/h　制球${p.control}　疲${p.fatigue}</li>`).join("")}</ol><div class=roster-actions><button onclick="autoRotation()">自動編成</button></div><h3 style="margin-top:18px">状態管理</h3><p class=small>試合後に疲労が蓄積し、休養日に回復します。調子は日々変動し、怪我は一定確率で発生します。</p></div></div>`}
function promote(id){let p=playerById(id);if(!p||!p.minor)return;let active=state.players.filter(x=>x.teamId===state.controlTeam&&!x.minor&&!x.injury);if(active.length>=28){let target=active.sort((a,b)=>rating(a)-rating(b))[0];target.minor=true;}p.minor=false;autoLineup();state.lastMessage=`${p.name}を一軍に昇格させました。`;renderGame("lineup")}
function autoLineup(){let ps=state.players.filter(p=>p.teamId===state.controlTeam&&!p.minor&&!p.injury&&p.pos!=="P").sort((a,b)=>rating(b)-rating(a));state.lineups[state.controlTeam]=ps.slice(0,9).map(p=>p.id);state.lastMessage="打順を能力・コンディションを考慮して自動編成しました。";renderGame("lineup")}
function autoRotation(){let ps=state.players.filter(p=>p.teamId===state.controlTeam&&!p.minor&&!p.injury&&p.pos==="P").sort((a,b)=>rating(b)-rating(a));state.rotation[state.controlTeam]=ps.slice(0,5).map(p=>p.id);state.lastMessage="先発ローテーションを能力・コンディションを考慮して自動編成しました。";renderGame("lineup")}
function standingsView(){let row=(x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td class=num>${x.wins}</td><td class=num>${x.losses}</td><td class=num>${x.ties}</td><td class=num>${x.runsFor-x.runsAgainst>0?"+":""}${x.runsFor-x.runsAgainst}</td></tr>`;return `<div class=grid2><div class=panel><h3>セ・リーグ</h3><table><thead><tr><th>順位</th><th>球団</th><th class=num>勝</th><th class=num>敗</th><th class=num>分</th><th class=num>得失</th></tr></thead><tbody>${standings("セ").map(row).join("")}</tbody></table></div><div class=panel><h3>パ・リーグ</h3><table><thead><tr><th>順位</th><th>球団</th><th class=num>勝</th><th class=num>敗</th><th class=num>分</th><th class=num>得失</th></tr></thead><tbody>${standings("パ").map(row).join("")}</tbody></table></div></div>`}
function newStrengthView(){
  let own=state.players.filter(p=>p.teamId===state.controlTeam&&p.minor).sort((a,b)=>overall(b)-overall(a)).slice(0,6);
  let market=state.players.filter(p=>p.teamId!==state.controlTeam).sort((a,b)=>overall(b)-overall(a)).slice(0,6);
  return `<div class="grid2"><div class="panel"><div class="section-head"><div><h2>新戦力</h2><small>補強候補・若手チェック</small></div><span class="system-tag">SCOUTING</span></div><h3>自軍 二軍注目選手</h3>${own.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${p.pos} / ${p.age}歳 / ${p.development}</span></div><div>${ability(overall(p))}</div></div>`).join("")||`<p class="small">候補選手はいません。</p>`}</div><div class="panel"><div class="section-head"><div><h2>他球団チェック</h2><small>現在は情報確認用</small></div></div>${market.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${team(p.teamId).name} / ${p.pos} / ${p.age}歳</span></div><div>${ability(overall(p))}</div></div>`).join("")}<div class="notice mini-notice">トレード・FA・ドラフト獲得はオフシーズン機能として順次実装します。</div></div></div>`;
}
function teamInfoView(){
  let t=team(state.controlTeam),rec=state.teams[state.controlTeam],roster=state.players.filter(p=>p.teamId===state.controlTeam),active=roster.filter(p=>!p.minor&&!p.retired),minor=roster.filter(p=>p.minor);
  let hitters=roster.filter(p=>p.pos!=="P").sort((a,b)=>overall(b)-overall(a)).slice(0,3),pitchers=roster.filter(p=>p.pos==="P").sort((a,b)=>overall(b)-overall(a)).slice(0,3);
  return `<div class="team-info-grid"><div class="panel club-card"><div class="club-crest">${t.league}</div><div><h2>${t.name}</h2><p>${t.city}　／　${t.league}リーグ</p></div><div class="club-record"><b>${rec.wins}</b><span>勝</span><b>${rec.losses}</b><span>敗</span></div></div><div class="mini-grid four"><div class="statbox"><b>${active.length}</b><span>一軍人数</span></div><div class="statbox"><b>${minor.length}</b><span>二軍人数</span></div><div class="statbox"><b>${Math.round(calcTeamPower(state.controlTeam))}</b><span>チーム力</span></div><div class="statbox"><b>${rec.runsFor-rec.runsAgainst>=0?"+":""}${rec.runsFor-rec.runsAgainst}</b><span>得失点</span></div></div><div class="grid2"><div class="panel"><h3>主力野手</h3>${hitters.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${p.pos}</span></div>${ability(overall(p))}</div>`).join("")}</div><div class="panel"><h3>主力投手</h3>${pitchers.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${p.role} / ${p.velocity}km/h</span></div>${ability(overall(p))}</div>`).join("")}</div></div><div class="panel"><h3>球団運営</h3><div class="info-lines"><div><span>球団方針</span><b>戦力均衡・育成重視</b></div><div><span>本拠地</span><b>${t.city}</b></div><div><span>選手総数</span><b>${roster.length}人</b></div><div><span>シーズン成績</span><b>${rec.wins}勝 ${rec.losses}敗 ${rec.ties}分</b></div></div></div></div>`;
}

function saveView(){return `<div class=panel><h3>セーブデータ</h3>${[1,2,3,4,5].map(s=>`<div class=match><span>セーブ${s}　${localStorage.getItem(SAVE_KEY+s)?"保存済み":"空き"}</span><button onclick="save(${s})">保存</button></div>`).join("")}<div class=actions style="margin-top:16px"><button class=danger onclick="if(confirm('タイトル画面に戻りますか？')){state=null;renderTitle()}">タイトル画面に戻る</button></div></div>`}
renderTitle();
</script>
</body>
</html>

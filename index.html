<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Meiryo,"Yu Gothic",system-ui,sans-serif;color:var(--ink)}body{background:linear-gradient(#edf3fb,#cfdbea)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #7186a5;border-radius:4px;background:linear-gradient(#fff,#e4ebf4);color:#17243b;padding:8px 12px;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.14)}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:linear-gradient(#ffe97e,#e7bb2d);border-color:#af8614;color:#16356d}.blue{background:linear-gradient(#4e86ca,#285a9e);color:#fff;border-color:#204d88}.red{background:linear-gradient(#f18a89,#d24d4d);color:#fff;border-color:#a53131}.hidden{display:none!important}.small{font-size:11px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}

/* More realistic pitcher accounting for the controlled teams and all AI teams. */
window.simulateGame=function(g){
  ensureV19State(state);ensureLineupsAll();
  const ah=teamAttack(g.away),hh=teamAttack(g.home),ap=teamPitch(g.away),hp=teamPitch(g.home);
  let as=Math.max(0,Math.round(3+(ah-hp)*.055+(Math.random()*3.8-1.9)));
  let hs=Math.max(0,Math.round(3+(hh-ap)*.055+(Math.random()*3.8-1.9)));
  if(as===hs){if(Math.random()<.5)as++;else hs++;}
  g.played=true;g.awayScore=as;g.homeScore=hs;
  const ar=state.teams[g.away],hr=state.teams[g.home];
  ar.runsFor+=as;ar.runsAgainst+=hs;hr.runsFor+=hs;hr.runsAgainst+=as;
  if(as>hs){ar.wins++;hr.losses++;ar.streak='W';hr.streak='L'}else{hr.wins++;ar.losses++;hr.streak='W';ar.streak='L'}
  updateHitterStats(g.away,as);updateHitterStats(g.home,hs);
  [g.away,g.home].forEach((tid,sideIdx)=>{
    const rot=rotationFor(tid),starter=rot[Math.floor(((state.games||[]).filter(x=>x.played&&(x.home===tid||x.away===tid)).length||0)/1)%5]||rot[0];
    if(starter){const own=sideIdx===0?as:hs,opp=sideIdx===0?hs:as;const ip=Math.min(8,Math.max(4.0,5.0+Math.random()*2.5));starter.ip+=ip;starter.er+=Math.max(0,own-Math.round(Math.random()*1.1));starter.so+=Math.max(0,Math.round(ip*(starter.velocity-134)/8+Math.random()*2.5));starter.era=starter.ip?starter.er*9/starter.ip:0;if(own>opp){starter.wins++;}}
    const relievers=teamPlayers(tid).filter(p=>p.pos==='P'&&!p.retired&&!p.minor&&!p.injury&&p.id!==starter?.id&&p.role!=='先発').sort((a,b)=>rating(b)-rating(a));
    if(relievers.length && sideIdx===0){const closer=relievers.find(p=>p.role==='抑え')||relievers[0];if(as<hs)closer.saves=(closer.saves||0)+1;}
  });
  wearAndTear(g.away);wearAndTear(g.home);
  [g.away,g.home].forEach(tid=>teamPlayers(tid).filter(p=>p.rookie&&p.reveal<100).forEach(p=>p.reveal=Math.min(100,p.reveal+1)));
  if(g.home===state.controlTeam||g.away===state.controlTeam){
    const won=(g.home===state.controlTeam&&hs>as)||(g.away===state.controlTeam&&as>hs);
    state.v19.lastResults.unshift({id:g.id,date:g.date,away:g.away,home:g.home,awayScore:as,homeScore:hs,won});
    state.v19.lastResults=state.v19.lastResults.slice(0,20);
    state.v19.resultHistory.unshift({id:g.id,date:g.date,away:g.away,home:g.home,awayScore:as,homeScore:hs});
    state.v19.resultHistory=state.v19.resultHistory.slice(0,120);
  }
};

window.newSeason=function(){

  _newSeason18();
  ensureV19State(state);
  state.players.forEach(p=>{
    if(p.retired)return;
    const before=p._v19Before||snapAbility(p),after=snapAbility(p),delta=diffAbility(before,after);

    const cb=p._v19CareerBefore||{totalHits:0,totalHR:0,totalWins:0}; const sb=p._v19StatBefore||{}; p.career=p.career||{}; p.career.totalHits=cb.totalHits+(p.pos==='P'?0:(sb.hits||0)); p.career.totalHR=cb.totalHR+(p.pos==='P'?0:(sb.hr||0)); p.career.totalWins=cb.totalWins+(p.pos==='P'?(sb.wins||0):0);

function calcAwards(){
  const year=state.year, all=state.players.filter(p=>!p.retired);
  const hitters=all.filter(p=>p.pos!=='P'&&p.atBats>=120).sort((a,b)=>(b.avg-a.avg)||(b.hr-a.hr));
  const homers=all.filter(p=>p.pos!=='P').sort((a,b)=>b.hr-a.hr||b.rbi-a.rbi);
  const rbis=all.filter(p=>p.pos!=='P').sort((a,b)=>b.rbi-a.rbi);
  const pitchers=all.filter(p=>p.pos==='P'&&p.ip>=20).sort((a,b)=>(a.era-b.era)|| (b.wins-a.wins));
  const wins=all.filter(p=>p.pos==='P').sort((a,b)=>b.wins-a.wins||b.so-a.so);
  const rookies=all.filter(p=>p.rookie&&p.atBats>=60||p.rookie&&p.ip>=10).sort((a,b)=>overall(b)-overall(a)+(b.wins-a.wins)*2+(b.hr-a.hr));
  const champ=state.postseason?.champion?team(state.postseason.champion):null;
  const mvpPool=all.filter(p=>p.pos!=='P'&&p.atBats>=100||p.pos==='P'&&p.ip>=30).sort((a,b)=>{
    const va=a.pos==='P'?(a.wins*12+a.so*.25-a.er*.25):(a.hits+a.hr*8+a.rbi*1.5); const vb=b.pos==='P'?(b.wins*12+b.so*.25-b.er*.25):(b.hits+b.hr*8+b.rbi*1.5); return vb-va;
  });
  const awards={year,champion:champ?champ.id:null,bestAverage:hitters[0]?.id||null,homeRunKing:homers[0]?.id||null,rbiKing:rbis[0]?.id||null,saiYoung:pitchers[0]?.id||null,winLeader:wins[0]?.id||null,rookieKing:rookies[0]?.id||null,mvp:mvpPool[0]?.id||null};
  state.v19.awards=awards;
  Object.entries({首位打者:awards.bestAverage,本塁打王:awards.homeRunKing,打点王:awards.rbiKing,最優秀防御率:awards.saiYoung,最多勝:awards.winLeader,新人王:awards.rookieKing,MVP:awards.mvp}).forEach(([name,id])=>{if(id){const p=playerById(id);if(p){p.awards=p.awards||[];p.awards.unshift({year,name});p.career.awards=p.career.awards||[];p.career.awards.push({year,name});}}});
  if(champ){state.v19.milestones.unshift(year+'年 日本一：'+champ.name);state.v19.milestones=state.v19.milestones.slice(0,30);}
  return awards;
}

/* Off-season flow: retirement -> renewal/release -> FA -> scouting -> draft -> new season. */
window.advanceOffseason=function(){
  ensureV19State(state);const step=state.offseason.step||0;
  if(step===0){
    state.players.forEach(p=>{if(!p.retired&&p.age>=38&&Math.random()<.52){p.retired=true;p.teamId=p.teamId;state.news.unshift({date:state.currentDate,text:p.name+'が現役を引退しました。'});} });
    state.players.filter(p=>!p.retired&&p.contractYears<=1&&p.teamId).forEach(p=>{p.expiring=true;p.contractDemand=Math.max(800,Math.round(p.salary*(1.03+Math.random()*.22)));p.contractPreference=Math.random()<.35?'3年':Math.random()<.6?'2年':'1年';if(p.teamId!==state.controlTeam)p.freeAgent=true;else p.freeAgent=false;});
    state.offseason.faList=state.players.filter(p=>p.freeAgent&&!p.retired).map(p=>p.id);
    state.offseason.step=1;state.lastMessage='契約更改・戦力外通告の期間です。';renderGame('newstrength');return;
  }
  if(step===1){
    const pending=state.players.some(p=>p.teamId===state.controlTeam&&!p.retired&&p.expiring&&!state.v19.contractDecisions[p.id]);
    if(pending){if(!confirm('未決定の契約更改があります。自動更新して次へ進みますか？')){renderGame('newstrength');return;}}
    state.players.filter(p=>p.teamId===state.controlTeam&&!p.retired&&p.expiring&&!state.v19.contractDecisions[p.id]).forEach(p=>renewContract(p.id,Math.round(p.contractDemand*0.98),p.contractPreference==='3年'?3:p.contractPreference==='2年'?2:1,true));
    state.offseason.step=2;state.players.filter(p=>p.freeAgent&&!p.retired).forEach(p=>{});state.lastMessage='FA交渉期間です。';renderGame('newstrength');return;
  }
  if(step===2){state.offseason.step=3;state.lastMessage='ドラフト候補の調査期間です。';renderGame('newstrength');return;}
  if(step===3){state.offseason.step=4;state.lastMessage='ドラフト会議。候補を指名できます。';renderGame('newstrength');return;}
  if(step===4){state.offseason.step=5;state.lastMessage='ドラフト終了。新年度へ進めます。';renderGame('newstrength');return;}
  newSeason();renderGame('schedule');
};

window.renewContract=function(pid,salary,years,silent){
  const p=playerById(pid);if(!p||p.teamId!==state.controlTeam||p.retired)return false;
  const t=state.teams[state.controlTeam];salary=Math.max(700,Math.round(Number(salary)||p.salary));years=Math.max(1,Math.min(4,Math.round(Number(years)||1)));
  const delta=salary-(p.salary||0);t.money=Math.max(0,t.money-delta*.2);
  p.salary=salary;p.contractYears=years;p.expiring=false;p.freeAgent=false;state.v19.contractDecisions[p.id]={salary,years};
  if(!silent){state.lastMessage=p.name+'と'+years+'年契約、年俸'+salary.toLocaleString()+'万円で契約更改しました。';renderGame('newstrength');}
  return true;
};

window.signFA=function(id,years,offer){
  const p=playerById(id);if(!p||!p.freeAgent||state.offseason.step!==2)return;
  years=Math.max(1,Math.min(4,Number(years)||2));const demand=p.contractDemand||Math.round(p.salary*1.2),salary=Math.max(800,Math.round(Number(offer)||demand));

/* Keep a result log, but never interrupt the daily calendar with a separate result screen. */
window.nextDay=function(){
  if(!state)return renderTitle();
  unlockBGM();ensureV19State(state);ensureSchedule();
  try{
    if(state.phase==='regular'){
      const date=state.currentDate;
      const gs=gamesOn(date).filter(g=>!g.played);
      gs.forEach(simulateGame);
      TEAMS.forEach(t=>teamPlayers(t.id).forEach(p=>{if(!p.retired){p.fatigue=Math.max(0,p.fatigue-2);p.form=clamp(p.form+(50-p.form)*.04)}}));
      state.dailyResults={date,games:gs.map(g=>({id:g.id,date:g.date,home:g.home,away:g.away,homeScore:g.homeScore,awayScore:g.awayScore}))};
      state.v19=state.v19||{};state.v19.resultHistory=state.v19.resultHistory||[];
      gs.forEach(g=>state.v19.resultHistory.unshift({id:g.id,date:g.date,home:g.home,away:g.away,homeScore:g.homeScore,awayScore:g.awayScore}));
      state.v19.resultHistory=state.v19.resultHistory.slice(0,120);
      state.lastResult=gs.find(g=>g.home===state.controlTeam||g.away===state.controlTeam)||null;
      const d=dateObj(date);d.setUTCDate(d.getUTCDate()+1);state.currentDate=dateIso(d);
      if(!state.games.some(g=>!g.played))finishRegularSeason();
      state.lastMessage=gs.length?fullDate(date)+'の試合結果を反映しました。':'本日は試合がありません。';
      renderGame('schedule');
      return;
    }
    if(state.phase==='cs'||state.phase==='japan'){advanceSeries();renderGame('schedule');return;}
    advanceOffseason();
  }catch(e){console.error(e);state.lastMessage='日程進行中にエラーが発生しました：'+e.message;renderGame('schedule');}
};

   Focus: preserve user progress, simplify daily play, harden old-save migration,
   make offseason controls usable at the correct step, and add a game-like status layer. */
(function(){
  function ensureV23State(s){
    if(!s) return s;
    if(typeof ensureV19State==='function') ensureV19State(s);
    s.version=23;
    s.dailyResults=s.dailyResults&&Array.isArray(s.dailyResults.games)?s.dailyResults:null;
    s.v19=s.v19||{};
    s.v19.news=Array.isArray(s.v19.news)?s.v19.news:[];
    s.v19.resultHistory=Array.isArray(s.v19.resultHistory)?s.v19.resultHistory:[];
    s.v19.contractDecisions=s.v19.contractDecisions||{};
    s.v19.awardsHistory=Array.isArray(s.v19.awardsHistory)?s.v19.awardsHistory:[];
    s.v19.qualityLog=Array.isArray(s.v19.qualityLog)?s.v19.qualityLog:[];
    s.players.forEach(p=>{
      p.expiring=!!p.expiring;
      p.freeAgent=!!p.freeAgent;
      if(!Number.isFinite(Number(p.contractDemand))||Number(p.contractDemand)<=0)p.contractDemand=Math.max(800,Math.round((Number(p.salary)||900)*1.12));
      p.contractPreference=p.contractPreference||'1年';
      p.statHistory=Array.isArray(p.statHistory)?p.statHistory:[];
      p.growthHistory=Array.isArray(p.growthHistory)?p.growthHistory:[];
      p.awards=Array.isArray(p.awards)?p.awards:[];
      p.career=p.career||{seasons:0,totalHits:0,totalHR:0,totalWins:0,awards:[]};
    });
    s.offseason=s.offseason||{step:0,candidates:[],faList:[]};
    s.offseason.candidates=Array.isArray(s.offseason.candidates)?s.offseason.candidates:[];
    s.offseason.faList=Array.isArray(s.offseason.faList)?s.offseason.faList:[];
    return s;
  }
  window.ensureV23State=ensureV23State;

  /* Preserve played games when an old save has a malformed/legacy schedule. */
  const _ensureSchedule23=ensureSchedule;

<script>

      dbl=clampP(dbl+.003);

  function log27(g,inning,side,text,type,runs){g.events.push({inning,side,text,type,runs:runs||0});}
  function advanceRunners27(g,side,batter,event,bases,outsBefore){

      if(old[2]!==null)scoreRunner(old[2]);

      if(old[0]!==null)bases[1]=old[0];
      if(old[1]!==null)bases[2]=old[1];
      if(old[2]!==null){ /* already scored */ }

  function speed27(pid){const p=typeof pid==='string'?playerById(pid):pid;return clamp27(p?.speed,1,100)/100;}
  function attemptSteal27(g,side,bases,outs,inning,battingLine){
    if(outs>=2||bases[0]===null)return 0;

  function choosePitcher27(ctx,tid,inning){

  function halfInning27(g,ctx,batting,pitching,inning,side){
    let outs=0,runs=0;const bases=[null,null,null],line=lineupFor(batting).filter(Boolean);let pi=0;let guard=0;

        const bench=teamPlayers(batting).filter(p=>p.pos!=='P'&&!p.retired&&!p.minor&&!p.injury&&!line.includes(p)).sort((a,b)=>rating(b)-rating(a))[0];

      }

    const margin=Math.abs(awayScore-homeScore);if(margin<=3){const cp=wList.slice().reverse().map(x=>playerById(x.id)).find(p=>p&&p.role==='抑え');if(cp){cp.saves=(cp.saves||0)+1;const row=wList.find(x=>x.id===cp.id);if(row)row.decision='S';}}

  const ensure29=(p)=>{if(!p)return p; if(typeof p.atBats!=='number')p.atBats=0;if(typeof p.hits!=='number')p.hits=0;if(typeof p.hr!=='number')p.hr=0;if(typeof p.rbi!=='number')p.rbi=0;if(typeof p.walks!=='number')p.walks=0;if(typeof p.strikeouts!=='number')p.strikeouts=0;if(typeof p.steals!=='number')p.steals=0;if(typeof p.caughtStealing!=='number')p.caughtStealing=0;if(typeof p.runs!=='number')p.runs=0;if(typeof p.errors!=='number')p.errors=0;if(typeof p.ip!=='number')p.ip=0;if(typeof p.er!=='number')p.er=0;if(typeof p.so!=='number')p.so=0;if(typeof p.wins!=='number')p.wins=0;if(typeof p.losses!=='number')p.losses=0;if(typeof p.saves!=='number')p.saves=0;return p;};

    if(inning<7||batter.pos==='P')return null;const diff=ctx.score[batTid]-ctx.score[pitTid];if(diff>0)return null;
    const weak=rating(batter)<64||batter.contact<55;if(!weak)return null;const line=ctx.lineups[batTid]||[];
    const bench=teamPlayers(batTid).filter(p=>p.pos!=='P'&&!p.retired&&!p.minor&&!p.injury&&!line.some(x=>x?.id===p.id)).sort((a,b)=>rating(b)-rating(a));
    const cand=bench.find(p=>platoon29(p,playerById(ctx.pitchers[pitTid].current))>.005)||bench[0];
    if(!cand)return null;const gain=rating(cand)-rating(batter)+platoon29(cand,playerById(ctx.pitchers[pitTid].current))*100;return gain>=5&&rnd29()<.22?cand:null;
  }

  function applyAtBatStats29(b,event,adv){
    const p=ensure29(b);if(event.type==='BB'||event.type==='HBP'){p.walks++;return;}if(event.type==='SAC'||event.type==='SF')return;
    p.atBats++;if(['1B','2B','3B','HR'].includes(event.type)){p.hits++;if(event.type==='2B')p.doubles=(p.doubles||0)+1;if(event.type==='3B')p.triples=(p.triples||0)+1;if(event.type==='HR')p.hr++;}if(event.type==='K')p.strikeouts++;p.rbi+=(adv.runs||0);p.avg=p.atBats?p.hits/p.atBats:0;
  }

  function playHalf29(ctx,g,inning,side,batTid,pitTid){
    const bases=[null,null,null];let outs=0,runs=0,guard=0;const line=ctx.lineups[batTid]||[];if(!line.length)return 0;
    while(outs<3&&guard++<24){
      const baseBatter=line[ctx.order[batTid]%line.length];ctx.order[batTid]=(ctx.order[batTid]+1)%line.length;let batter=baseBatter;if(!batter)break;ensure29(batter);
      const stealOut=steal29(ctx,g,inning,side,bases,outs,batTid,pitTid);outs+=stealOut;if(outs>=3)break;
      const ph=shouldPH29(ctx,g,inning,batTid,pitTid,batter);if(ph){const idx=line.findIndex(x=>x?.id===batter.id);if(idx>=0){const old=batter;batter=ph;line[idx]=ph;ctx.subs.push({inning,side,type:'PH',from:old.id,to:ph.id});addLog29(g,inning,side,ph.name+'が代打で登場。','PH',0,ph.id);}}
      const pitcher=pitcher29(ctx,g,pitTid,inning);if(!pitcher)break;
      const diff=ctx.score[batTid]-ctx.score[pitTid];const event=outcome29(batter,pitcher,outs,bases,inning,diff);const before=bases.slice();
      const adv=runnerAdvance29(ctx,g,inning,side,batter,event,bases,pitTid);runs+=adv.runs;ctx.score[batTid]+=adv.runs;
      const pd=ctx.pitchers[pitTid],pid=pitcher.id;const pitches=3.5+rnd29()*5.5;pd.pitches[pid]=(pd.pitches[pid]||0)+pitches;pitcher.pitchCount=pd.pitches[pid];pd.outs[pid]=(pd.outs[pid]||0)+(['K','GROUNDOUT','FLYOUT','LINEOUT','SAC','SF'].includes(event.type)?1:(event.type==='GDP'?2:0));pd.so[pid]=(pd.so[pid]||0)+(event.type==='K'?1:0);pd.er[pid]=(pd.er[pid]||0)+(event.type==='E'?0:adv.runs);pitcher.ip=(pitcher.ip||0);pitcher.fatigue=cap29((pitcher.fatigue||0)+pitches*.07,0,100);
      if(event.type==='E'){const f=fielder29(pitTid,rnd29()<.62?'IF':'OF');if(f){ensure29(f);f.errors++;addLog29(g,inning,side,f.name+'にエラー。','FIELD_ERR',adv.runs,f.id);}}
      applyAtBatStats29(batter,event,adv);
      const names={HR:'本塁打',BB:'四球',HBP:'死球','1B':'ヒット','2B':'二塁打','3B':'三塁打',SAC:'送りバント',SF:'犠牲フライ',GDP:'併殺打',E:'エラー',K:'三振',GROUNDOUT:'内野ゴロ',FLYOUT:'外野フライ',LINEOUT:'ライナー'};
      let text=batter.name+'は'+names[event.type];if(event.type==='K'&&rnd29()<.48)text+=(pitcher.velocity>=145?'（空振り三振）':'（見逃し三振）');if(event.type==='GROUNDOUT')text+=(bases[2]!=null?'。三塁走者を進められず':'。');if(adv.runs)text+='。'+adv.runs+'点！';text+='。';addLog29(g,inning,side,text,event.type,adv.runs,batter.id);
      outs += (event.type==='GDP'?2:(['K','SAC','SF','GROUNDOUT','FLYOUT','LINEOUT'].includes(event.type)?1:0));
      if(event.type==='GDP'&&before[0]==null)outs=Math.max(0,outs-1); // safety guard for an impossible double play
    }
    // Late lead: consider a defensive replacement.
    const other=batTid===g.away?g.home:g.away;if(inning>=8&&ctx.score[batTid]>=ctx.score[other]){
      const current=ctx.lineups[batTid]||[];const bench=teamPlayers(batTid).filter(p=>p.pos!=='P'&&!p.retired&&!p.minor&&!p.injury&&!current.some(x=>x?.id===p.id)).sort((a,b)=>(b.def+b.catching*.35)-(a.def+a.catching*.35))[0];
      if(bench&&rnd29()<.14){let idx=-1,best=999;current.forEach((p,i)=>{const v=(p?.def||0)+(p?.catching||0)*.35;if(p?.pos!=='P'&&v<best){best=v;idx=i}});if(idx>=0&&best<bench.def+bench.catching*.35){const old=current[idx];current[idx]=bench;bench.role='守備要員';ctx.subs.push({inning,side,type:'DEF',from:old.id,to:bench.id});addLog29(g,inning,side,bench.name+'が守備固めで出場。','DEF',0,bench.id);}}
    }
    return runs;
  }

  function simulateV29(g){
    ensureV19State(state);ensureLineupsAll();g.events=[];g.highlights=[];g.inningsAway=[];g.inningsHome=[];g.battingBox={};g.pitchingBox={};g.substitutions=[];g.fieldingBox={};
    const ctx={order:{},score:{[g.away]:0,[g.home]:0},lineups:{},subs:[],pitchers:{}};
    [g.away,g.home].forEach(tid=>{ctx.order[tid]=0;ctx.lineups[tid]=lineupFor(tid).slice();const st=starter29(tid);ctx.pitchers[tid]={starter:st?.id||null,current:st?.id||null,pitches:{},outs:{},er:{},so:{}};if(st){ensure29(st);ctx.pitchers[tid].pitches[st.id]=0;ctx.pitchers[tid].outs[st.id]=0;ctx.pitchers[tid].er[st.id]=0;ctx.pitchers[tid].so[st.id]=0;}});
    let A=0,H=0;
    for(let inn=1;inn<=12;inn++){
      const ba=A,bh=H;ctx.score[g.away]=A;ctx.score[g.home]=H;playHalf29(ctx,g,inn,'away',g.away,g.home);A=ctx.score[g.away];g.inningsAway.push(A-ba);ctx.score[g.away]=A;ctx.score[g.home]=H;
      if(inn<9||H<=A){playHalf29(ctx,g,inn,'home',g.home,g.away);H=ctx.score[g.home];g.inningsHome.push(H-bh);}else g.inningsHome.push(0);
      if(inn>=9&&A!==H)break;
      if(inn===12&&A===H){if(rnd29()<.5){A++;g.inningsAway[11]=(g.inningsAway[11]||0)+1;ctx.score[g.away]=A;addLog29(g,inn,'away','延長12回、勝ち越し！','GOAHEAD',1)}else{H++;g.inningsHome[11]=(g.inningsHome[11]||0)+1;ctx.score[g.home]=H;addLog29(g,inn,'home','延長12回、サヨナラ！','WALKOFF',1)}break;}
    }
    g.played=true;g.awayScore=A;g.homeScore=H;g.generatedAt=Date.now();
    const ar=state.teams[g.away],hr=state.teams[g.home];ar.runsFor+=A;ar.runsAgainst+=H;hr.runsFor+=H;hr.runsAgainst+=A;if(A>H){ar.wins++;hr.losses++;ar.streak='W';hr.streak='L'}else{hr.wins++;ar.losses++;hr.streak='W';ar.streak='L'}
    [g.away,g.home].forEach(tid=>{const pd=ctx.pitchers[tid],rows=[];Object.keys(pd.pitches).forEach(pid=>{const p=ensure29(playerById(pid));if(!p)return;const outs=pd.outs[pid]||0,ip=outs/3,er=pd.er[pid]||0,so=pd.so[pid]||0;p.ip+=ip;p.er+=er;p.so+=so;p.era=p.ip?p.er*9/p.ip:0;p.pitchCount=pd.pitches[pid]||0;rows.push({id:pid,ip,er,so,decision:'',pitches:pd.pitches[pid]||0});});g.pitchingBox[tid]=rows;});
    const winner=A>H?g.away:g.home,loser=winner===g.away?g.home:g.away;const wb=g.pitchingBox[winner]||[],lb=g.pitchingBox[loser]||[];const winCandidate=wb.find(x=>x.id===ctx.pitchers[winner].starter&&x.ip>=5)||wb[wb.length-1];const lossCandidate=lb[0]||lb[lb.length-1];if(winCandidate){const p=ensure29(playerById(winCandidate.id));p.wins++;winCandidate.decision='W';}if(lossCandidate){const p=ensure29(playerById(lossCandidate.id));p.losses++;lossCandidate.decision='L';}if(wb.length>1&&Math.abs(A-H)<=3){const sv=wb[wb.length-1];if(sv&&sv.id!==winCandidate?.id){const p=ensure29(playerById(sv.id));p.saves++;sv.decision='S';}}
    [g.away,g.home].forEach(tid=>{const box={};(g.events||[]).filter(e=>e.side===(tid===g.away?'away':'home')&&e.playerId).forEach(e=>{const x=box[e.playerId]||(box[e.playerId]={id:e.playerId,ab:0,h:0,hr:0,rbi:0,bb:0,k:0,sb:0});if(e.type==='BB'||e.type==='HBP')x.bb++;else if(!['SAC','SF','SB','CS','PH','DEF','PITCH','FIELD_ERR','GOAHEAD','WALKOFF'].includes(e.type)){x.ab++;if(['1B','2B','3B','HR'].includes(e.type))x.h++;if(e.type==='HR')x.hr++;if(e.type==='K')x.k++;}x.rbi+=e.runs||0;});Object.values(box).forEach(x=>{const p=playerById(x.id);x.sb=p?.steals||0;x.cs=p?.caughtStealing||0;});g.battingBox[tid]=Object.values(box).filter(x=>x.ab||x.bb||x.rbi||x.sb||x.cs);});
    g.substitutions=ctx.subs;const leadChanges=(()=>{let a=0,h=0,last=0,c=0;for(let i=0;i<g.inningsAway.length;i++){a+=g.inningsAway[i]||0;h+=g.inningsHome[i]||0;const s=a>h?1:h>a?-1:0;if(s&&last&&s!==last)c++;if(s)last=s;}return c})();
    g.meta={maxInning:g.inningsAway.length,extraInnings:Math.max(0,g.inningsAway.length-9),leadChanges,leftyRighty:true,engine:'V29'};
    g.highlights=(g.events||[]).filter(e=>['HR','SB','CS','GDP','E','FIELD_ERR','GOAHEAD','WALKOFF','PITCH','PH','DEF','SAC','SF'].includes(e.type)||e.runs>0).slice(-22).map(e=>e.text);
    [g.away,g.home].forEach(tid=>teamPlayers(tid).forEach(p=>{if(p.retired)return;const used=ctx.lineups[tid]?.some(x=>x?.id===p.id);if(used)p.fatigue=cap29((p.fatigue||0)+4,0,100);else p.fatigue=Math.max(0,(p.fatigue||0)-1);}));
    [g.away,g.home].forEach(tid=>teamPlayers(tid).filter(p=>p.rookie&&p.reveal<100).forEach(p=>p.reveal=Math.min(100,(p.reveal||0)+1)));
    if(g.home===state.controlTeam||g.away===state.controlTeam){const won=(g.home===state.controlTeam&&H>A)||(g.away===state.controlTeam&&A>H);const rec={id:g.id,date:g.date,away:g.away,home:g.home,awayScore:A,homeScore:H,won,inningsAway:g.inningsAway,inningsHome:g.inningsHome,events:g.events.slice(-180),battingBox:g.battingBox,pitchingBox:g.pitchingBox,substitutions:g.substitutions,meta:g.meta};state.v19.lastResults.unshift(rec);state.v19.lastResults=state.v19.lastResults.slice(0,20);state.v19.resultHistory.unshift(rec);state.v19.resultHistory=state.v19.resultHistory.slice(0,120);state.lastResult=g;}
    return g;
  }

  window.simulateGame=simulateV29;
  window.processCurrentDay=function(){if(!state||state.phase!=='regular')return;const gs=gamesOn(state.currentDate);gs.filter(g=>!g.played).forEach(g=>simulateV29(g));TEAMS.forEach(t=>teamPlayers(t.id).forEach(p=>{if(!p.retired){p.fatigue=Math.max(0,(p.fatigue||0)-2);p.form=clamp(p.form+(50-p.form)*.04);if(p.injury){p.injuryDays=Math.max(0,(p.injuryDays||0)-1);if(p.injuryDays===0)p.injury=null}}}));const d=dateObj(state.currentDate);d.setUTCDate(d.getUTCDate()+1);state.currentDate=dateIso(d);if(!state.games.some(g=>!g.played))finishRegularSeason()};
  window.nextDay=function(){if(!state)return;unlockBGM();if(state.phase==='regular')window.processCurrentDay();else if(state.phase==='cs'||state.phase==='japan')advanceSeries();else advanceOffseason();state.lastResult=null;safeRender('schedule')};
  window.advanceN=function(n){if(!state)return;unlockBGM();n=Math.max(1,Math.min(31,Number(n)||1));for(let i=0;i<n&&state.phase==='regular';i++)window.processCurrentDay();state.lastResult=null;state.lastMessage=n+'日分進行しました。';safeRender('schedule')};
})();
</script>

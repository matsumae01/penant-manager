function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fatigueFactor(p){return clamp(0.55+p.condition/220,0.60,1.02)}
function stat(p,k){return (p[k]||0)*fatigueFactor(p)}
function hasTrait(p,t){return (p.specialTraits||[]).includes(t)}
function lineupFactor(p){return p.squad==="1軍"?1:0.28}
function simulateHitter(p,games){
 const used=Math.max(0,Math.round(games*(p.squad==="1軍"?(p.role==="代打"?0.42:p.role==="代走"?0.35:0.78):0.42)));
 if(used<=0)return;
 const form=fatigueFactor(p);
 let contact=clamp(stat(p,"con"),25,100), power=clamp(stat(p,"pow"),25,100), speed=clamp(stat(p,"spd"),25,100);
 if(hasTrait(p,"アベレージヒッター"))contact+=7; if(hasTrait(p,"パワーヒッター"))power+=9; if(hasTrait(p,"広角打法"))contact+=3;
 const ab=Math.max(8,Math.round(used*3.45));
 const avg=clamp(0.145+contact*0.0029+speed*0.00025+(hasTrait(p,"アベレージヒッター")?0.022:0),0.16,0.42);
 const hits=Math.max(0,Math.round(ab*avg));
 const hrRate=clamp(0.003+(power-45)*0.00042+(hasTrait(p,"パワーヒッター")?0.008:0),0.004,0.085);
 const hr=Math.min(Math.max(0,Math.round(ab*hrRate)),Math.max(0,Math.floor(hits*0.55)));
 let rbi=Math.max(0,Math.round(hits*0.28+hr*1.35+(hasTrait(p,"チャンス")?1.2:0)+R(-2,2)));
 if(p.squad!=="1軍")rbi=Math.round(rbi*.72);
 p.games+=used;p.ab+=ab;p.hits+=hits;p.hr+=hr;p.rbi+=rbi;p.avg=p.ab?p.hits/p.ab:0;
 p.condition=Math.max(28,p.condition-R(used>35?7:4,used>35?14:9));
}
function simulatePitcher(p,games){
 const used=Math.max(0,Math.round(games*(p.squad==="1軍"?(p.role==="先発"?0.46:p.role==="抑え"?0.20:0.32):0.22)));
 if(used<=0)return;
 const form=fatigueFactor(p), ctrl=stat(p,"ctrl"), pitch=stat(p,"pitch"), sta=stat(p,"sta");
 let innings;
 if(p.role==="先発") innings=used*(4.7+sta*.035); else if(p.role==="抑え") innings=used*(0.75+sta*.006); else innings=used*(1.25+sta*.012);
 if(p.squad!=="1軍") innings*=0.72;
 if(hasTrait(p,"回復○"))innings*=1.06;
 const era=clamp(6.2-(ctrl*.028)-(pitch*.024)-(sta*.008)+(p.condition<50?1.0:0)+(hasTrait(p,"ノビ")?-0.42:0)+(hasTrait(p,"キレ○")?-0.38:0)+(hasTrait(p,"対ピンチ")?-0.28:0),1.65,7.8);
 const er=Math.max(0,Math.round(innings*era/9+Math.random()*1.1-0.25));
 p.games+=used;p.ip+=innings;p.er+=er;
 if(p.role==="先発"){const quality=clamp(0.48+(ctrl+pitch+sta-180)/210+(hasTrait(p,"対ピンチ")?.05:0),.20,.82);p.wins+=Math.max(0,Math.round(used*quality*.28+Math.random()*.7))}
 if(p.role==="抑え")p.saves+=Math.max(0,Math.round(used*(0.24+(hasTrait(p,"ノビ")?.08:0))))
 p.condition=Math.max(25,p.condition-R(used>10?6:3,used>10?12:7));

function v11TeamNeed(cpu){

  return `<div class="page-title"><div><h1>${p.name} ― 成長履歴</h1><div class="date">新人時代から現在までの能力推移と年度別成績</div></div><div class="actions"><button onclick="window.rosterMode='detail';render()">選手データへ戻る</button></div></div><div class="grid"><div class="panel col12"><div class="panel-title">キャリアサマリー</div><div class="panel-body"><div class="v11-summary"><div><span>入団時</span><b>${first?first.overall:'—'}</b></div><div><span>現在</span><b>${last?last.overall:ov(p)}</b></div><div><span>全盛期</span><b>${peak?peak.overall:'—'}${peak?`（${peak.year}年）`:''}</b></div><div><span>入団時から</span><b>${first?`${diff>=0?'+':''}${diff}`:'—'}</b></div></div></div></div><div class="panel col12"><div class="panel-title">総合能力の推移</div><div class="panel-body">${chart}</div></div><div class="panel col12"><div class="panel-title">過去と能力比較</div><div class="panel-body"><div style="overflow:auto"><table><tr><th>年度</th><th>年齢</th><th>総合</th>${keys.map(k=>`<th>${k[1]}</th>`).join('')}</tr>${rows||`<tr><td colspan="${colCount}" class="muted">まだ年度データがありません。シーズンを進めると記録されるのだ。</td></tr>`}</table></div><div class="muted" style="margin-top:8px">現在の選手データに表示される能力をすべて掲載。ミート・パワー・肩力・守備力・捕球などはS〜Gランク、球速はkm/h、変化球は7段階で表示するのだ。球速の前年差もkm/h基準で計算しているのだ。</div></div></div>${panel('年度別成績',`<table><tr><th>年度</th><th>年齢</th><th>試合</th><th>${pitcher?'勝':'打率'}</th><th>${pitcher?'投球回':'HR'}</th><th>${pitcher?'防御率':'安打'}</th></tr>${seasonRows||`<tr><td colspan="6" class="muted">年度成績はシーズン終了後に記録されるのだ。</td></tr>`}</table>`,'col12')}</div>`;
};

// Returning to the main "選手" tab always starts from its MENU/list screen.
function switchMainTab(nextTab){

  html=html.replace(/(<button class="history-tab"[^>]*>成長履歴<\/button>)+/g,'<button class="history-tab" onclick="window.rosterMode=\'history\';window.selectedRosterId='+p.id+';render()">成長履歴</button>');
  // Player-data sidebar shows both pitchers and hitters, clearly separated into 1st/2nd team.

S.version='v11.5';

<script>
/* ===== v12: postseason / awards / club history / retirement ===== */
function v12Defaults(){
 S.postseason=S.postseason||{active:false,stage:0,game:0,wins:0,losses:0,opponent:'',champion:null,history:[]};
 S.awards=S.awards||[];
 S.leagueRecords=S.leagueRecords||{};
 S.hallOfFame=S.hallOfFame||[];
 S.retiredPlayers=S.retiredPlayers||[];
 S.clubRecords=S.clubRecords||{wins:0,losses:0,hr:0,hits:0};
 S.phase=S.phase||'regular';
 S.leagueGameLogs=S.leagueGameLogs||[];
}
v12Defaults();

function v12SeriesWinsNeeded(stage){return stage===3?4:2}
function v12SeriesLabel(stage){return stage===1?'CS 1stステージ':stage===2?'CS ファイナルステージ':'日本シリーズ'}
function v12StartPostseason(){
 v12Defaults();
 const myLeague=leagueOfIndex(S.team);
 const leagueIdx=myLeague==='セ・リーグ'?CENTRAL_TEAMS:PACIFIC_TEAMS;
 const st=[...S.standings].filter(x=>leagueIdx.includes(teams.indexOf(x.team))).sort((a,b)=>(b.w-b.l)-(a.w-a.l));
 const myRank=st.findIndex(x=>x.team===team())+1;
 if(myRank>=4){
  S.postseason={active:false,stage:0,game:0,wins:0,losses:0,opponent:'',champion:null,history:[]};
  S.phase='offseason';S.month=11;S.day=2;
  S.news.unshift(`${S.year}年レギュラーシーズン終了。${team()}は${myRank}位のためCS進出を逃しました。`);
  return;
 }
 const stage=myRank===1?2:1;
 const opponent=stage===2?st[1]?.team:st[myRank===2?2:1]?.team;
 S.postseason={active:true,stage,game:0,wins:0,losses:0,opponent:opponent||st[1]?.team||teams[(S.team+1)%12],champion:null,history:[]};
 S.phase='postseason';S.month=10;S.day=10;
 S.news.unshift(`${S.year}年${myLeague}レギュラーシーズン${myRank}位。${team()}は${stage===2?'CSファイナルステージから':'CS 1stステージから'}参戦します。`);
}
function v12OppStrength(name){const c=S.cpuTeams?.find(x=>x.team===name);return c?c.strength:52+R(-5,5)}
function v12PostGame(){
 if(!S.postseason?.active)return;
 const ps=S.postseason, need=v12SeriesWinsNeeded(ps.stage), opp=ps.opponent;
 const myBase=S.players.filter(p=>p.squad==='1軍').reduce((a,p)=>a+ov(p)*fatigueFactor(p),0)/Math.max(1,S.players.filter(p=>p.squad==='1軍').length);
 const my=scoreFor(myBase,Math.random()<.5), os=scoreFor(v12OppStrength(opp),Math.random()<.5); let a=my,b=os;if(a===b){if(Math.random()<.5)a++;else b++;}
 const won=a>b;if(won)ps.wins++;else ps.losses++;ps.game++;
 ps.history.unshift({stage:ps.stage,game:ps.game,opponent:opp,my:a,oppScore:b,won});
 S.news.unshift(`${v12SeriesLabel(ps.stage)} 第${ps.game}戦：${team()} ${a}-${b} ${opp}。${won?'勝利':'敗戦'}`);
 if(ps.wins>=need || ps.losses>=need){
  if(ps.stage===1){
   if(ps.wins>=need){ps.stage=2;ps.game=0;ps.wins=0;ps.losses=0;ps.opponent=([...S.standings].sort((x,y)=>(y.w-y.l)-(x.w-x.l))[0]?.team||teams[(S.team+1)%12]);S.news.unshift('CS 1stステージ突破。首位球団とのファイナルステージへ進出します。');}
   else {v12EndPostseason(false);}
  }else if(ps.stage===2){
   if(ps.wins>=need){ps.stage=3;ps.game=0;ps.wins=0;ps.losses=0;ps.opponent='パ・リーグ王者';S.news.unshift('CSファイナルステージ突破。日本シリーズ進出です！');}
   else v12EndPostseason(false);
  }else{
   if(ps.wins>=need){ps.champion=team();v12EndPostseason(true);}
   else v12EndPostseason(false);
  }
 }
 render();autoSave();
}
function v12EndPostseason(champion){
 const ps=S.postseason;ps.active=false;ps.champion=champion?team():null;S.phase='offseason';
 if(champion){S.champ=(S.champ||0)+1;S.news.unshift(`${S.year}年 日本一！${team()}が日本シリーズを制覇しました。`)}
 else S.news.unshift(`${S.year}年ポストシーズン終了。${team()}のシーズンが終了しました。`);
 S.month=11;S.day=2;
}
function v12AwardList(){
 const hs=S.players.filter(p=>p.type==='野手');const ps=S.players.filter(p=>p.type==='投手');
 const bestHR=hs.slice().sort((a,b)=>(b.hr||0)-(a.hr||0))[0],bestHit=hs.slice().sort((a,b)=>(b.hits||0)-(a.hits||0))[0];
 const bestWin=ps.slice().sort((a,b)=>(b.wins||0)-(a.wins||0))[0],bestSave=ps.slice().sort((a,b)=>(b.saves||0)-(a.saves||0))[0];
 const list=[];if(bestHR)list.push({title:'本塁打王',name:bestHR.name,value:`${bestHR.hr||0}本`});if(bestHit)list.push({title:'最多安打',name:bestHit.name,value:`${bestHit.hits||0}安打`});if(bestWin)list.push({title:'最多勝',name:bestWin.name,value:`${bestWin.wins||0}勝`});if(bestSave)list.push({title:'最多セーブ',name:bestSave.name,value:`${bestSave.saves||0}S`});
 const mvp=bestSeasonPlayer();if(mvp)list.push({title:'リーグMVP',name:mvp,value:'シーズン最優秀選手'});
 return list;
}
function v12Retire(){
 const retirees=[];
 S.players=S.players.filter(p=>{if(p.age>=39 || (p.age>=37&&Math.random()<.45)){retirees.push(p);return false}return true});
 retirees.forEach(p=>{S.retiredPlayers.unshift({year:S.year,name:p.name,age:p.age,type:p.type,pos:p.pos,careerHits:p.careerHits||0,careerHR:p.careerHR||0,careerWins:p.careerWins||p.wins||0});if((p.careerHits||0)>=1500||(p.careerHR||0)>=300||(p.careerWins||0)>=150){S.hallOfFame.unshift({year:S.year,name:p.name,reason:'通算記録により殿堂入り'});S.news.unshift(`${p.name}が現役を引退。球団殿堂入りとなりました。`)}else S.news.unshift(`${p.name}が現役を引退しました。`)});
}
function v12ArchiveSeason(){
 v12Defaults();
 const finished=S.year, awards=v12AwardList(), champ=!!S.postseason?.champion;
 const record={year:finished,wins:S.wins,losses:S.losses,rank:rank(),champ,team:team(),mvp:awards.find(x=>x.title==='リーグMVP')?.name||null,awards};
 S.history.unshift(record);S.teamHistory[team()]=S.teamHistory[team()]||[];S.teamHistory[team()].unshift(record);
 S.awards=awards;S.clubRecords.wins=Math.max(S.clubRecords.wins||0,S.wins);S.clubRecords.losses=Math.max(S.clubRecords.losses||0,S.losses);
 S.players.forEach(p=>{p.careerHits=(p.careerHits||0)+(p.hits||0);p.careerHR=(p.careerHR||0)+(p.hr||0);p.careerWins=(p.careerWins||0)+(p.wins||0);});
 v12Retire();
}
const __v12_oldFinishMonth=finishMonthTransition;
finishMonthTransition=function(){
 v12Defaults();
 if(S.month===9){v12StartPostseason();return}
 __v12_oldFinishMonth();
};
const __v12_oldArchive=archiveAndStartNewSeason;
archiveAndStartNewSeason=function(){
 const awards=v12AwardList();
 S.awards=awards;
 S.players.forEach(p=>{p.careerHits=(p.careerHits||0)+(p.hits||0);p.careerHR=(p.careerHR||0)+(p.hr||0);p.careerWins=(p.careerWins||0)+(p.wins||0);});
 v12Retire();
 __v12_oldArchive();
 S.phase='regular';v12Defaults();
};
const __v12_oldAdvanceDay=advanceDay;
advanceDay=function(){if(S.phase==='postseason'){v12PostGame();return}__v12_oldAdvanceDay();};
const __v12_oldAdvanceMonth=advanceMonth;
advanceMonth=function(){if(S.phase==='postseason'){v12PostGame();return}__v12_oldAdvanceMonth();};
const __v12_oldToEnd=toEnd;
toEnd=function(){if(S.phase==='postseason'){v12PostGame();return}__v12_oldToEnd();};

function setGameDateTarget(month,day){ S.month=month;S.day=day; }
function advanceToInterleague(){
 v12Defaults();
 if(S.phase!=='regular')return render();
 const target=gameDateKey(S.year,5,26);
 let guard=0;
 while(S.phase==='regular' && gameDateKey(S.year,S.month,S.day)<target && guard<250){advanceDay();guard++;}
 setGameDateTarget(5,26);render();autoSave();
}
function advanceToCS(){
 v12Defaults();
 if(S.phase!=='regular')return render();
 const target=gameDateKey(S.year,10,4);
 let guard=0;
 while(S.phase==='regular' && gameDateKey(S.year,S.month,S.day)<=target && guard<300){advanceDay();guard++;}
 if(S.phase==='regular'){ setGameDateTarget(10,4); v12StartPostseason(); }
 else if(S.phase==='postseason'){ setGameDateTarget(10,10); }
 render();autoSave();
}
function advanceToJapanSeries(){
 v12Defaults();
 if(S.phase==='regular')advanceToCS();
 if(S.phase==='offseason')return render();
 let guard=0;
 while(S.phase==='postseason' && S.postseason && S.postseason.stage<3 && guard<40){v12PostGame();guard++;}
 if(S.phase==='postseason' && S.postseason && S.postseason.stage>=3)setGameDateTarget(10,24);
 render();autoSave();
}
function advanceToDraft(){
 v12Defaults();
 if(S.phase==='regular')advanceToCS();
 if(S.phase==='offseason')return render();
 let guard=0;
 while(S.phase==='postseason' && S.postseason && S.postseason.stage<3 && gameDateKey(S.year,S.month,S.day)<gameDateKey(S.year,10,22) && guard<40){v12PostGame();guard++;}
 setGameDateTarget(10,22);
 S.news.unshift(`${S.year}年ドラフト会議（10月22日）まで進めました。`);
 render();autoSave();
}
function advanceToSeasonEnd(){
 v12Defaults();
 if(S.phase==='regular')advanceToCS();
 let guard=0;
 while(S.phase==='postseason' && guard<60){v12PostGame();guard++;}
 if(S.phase!=='postseason')setGameDateTarget(11,2);
 render();autoSave();
}

function v12TeamAbbr(name){
 const map={"阪神タイガース":"神","読売ジャイアンツ":"巨","横浜DeNAベイスターズ":"横","広島東洋カープ":"広","中日ドラゴンズ":"中","東京ヤクルトスワローズ":"ヤ","福岡ソフトバンクホークス":"ソ","北海道日本ハムファイターズ":"日","千葉ロッテマリーンズ":"ロ","東北楽天ゴールデンイーグルス":"楽","オリックス・バファローズ":"オ","埼玉西武ライオンズ":"西"};
 return map[name]||String(name||"").slice(0,1);
}
function v12LeagueResultsPanel(){
 const logs=(S.leagueGameLogs||[]);
 const dates=[...new Set(logs.map(g=>g.date))];
 const currentDate=gameDateKey(S.year,S.month,S.day);
 if(!window.selectedLeagueDate || (!dates.includes(window.selectedLeagueDate) && window.selectedLeagueDate!==currentDate)) window.selectedLeagueDate=currentDate;
 const selectedDate=window.selectedLeagueDate;
 const games=logs.filter(g=>g.date===selectedDate);
 const d=selectedDate.split('/');
 const idx=seasonCalendar(S.year).indexOf(selectedDate);
 const inter=isInterleagueIndex(idx);
 const navDates=[...new Set([...dates, ...seasonCalendar(S.year).slice(0,Math.max(0,idx)+1)])].sort((a,b)=>b.localeCompare(a));
 const pos=navDates.indexOf(selectedDate);
 const prev=pos>=0 ? navDates[pos+1]||null : null;
 const next=pos>0 ? navDates[pos-1] : null;
 const gameRow=g=>`<div class="v12-game-row ${g.home===team()||g.away===team()?'me':''}"><span class="v12-abbr">${v12TeamAbbr(g.home)}</span><b>${g.homeScore}</b><span class="v12-dash">-</span><b>${g.awayScore}</b><span class="v12-abbr">${v12TeamAbbr(g.away)}</span></div>`;
 const central=games.filter(g=>CENTRAL_TEAMS.includes(teams.indexOf(g.home))&&CENTRAL_TEAMS.includes(teams.indexOf(g.away)));
 const pacific=games.filter(g=>PACIFIC_TEAMS.includes(teams.indexOf(g.home))&&PACIFIC_TEAMS.includes(teams.indexOf(g.away)));
 const body=games.length===0
  ? `<div class="v12-travel-day"><b>移動日</b><span>本日は試合がありません。選手は移動・休養日に入ります。</span></div>`
  : inter
   ? `<div class="v12-results-title">交流戦</div><div class="v12-results-grid inter">${games.slice(0,6).map(gameRow).join('')}</div>`
   : `<div class="v12-results-grid"><div><div class="v12-results-title">セ・リーグ</div>${central.slice(0,3).map(gameRow).join('')||'<div class="muted">結果なし</div>'}</div><div><div class="v12-results-title">パ・リーグ</div>${pacific.slice(0,3).map(gameRow).join('')||'<div class="muted">結果なし</div>'}</div></div>`;
 return panel('日程・試合',
  `<div class="v12-results-nav"><button ${prev?'':'disabled'} onclick="window.selectedLeagueDate='${prev||selectedDate}';render()">← 前の日</button><div class="muted">${d[0]}年${d[1]}月${d[2]}日</div><button ${next?'':'disabled'} onclick="window.selectedLeagueDate='${next||selectedDate}';render()">次の日 →</button></div>${body}`,
  'col4');
}
function v12InterleaguePanel(){
 const rec=(S.interleagueRecords||teams.map(t=>({team:t,w:0,l:0}))).slice().sort((a,b)=>{const ap=a.w+a.l?a.w/(a.w+a.l):0,bp=b.w+b.l?b.w/(b.w+b.l):0;return bp-ap||b.w-a.w});
 return panel('セ・パ交流戦 成績',`<div class="muted" style="margin-bottom:7px">交流戦期間だけを対象にした12球団の順位です。</div><table><tr><th>順位</th><th>球団</th><th>勝</th><th>敗</th><th>勝率</th></tr>${rec.map((x,i)=>`<tr class="${x.team===team()?'me':''}"><td class="rank">${i+1}</td><td>${x.team}<small class="muted">　${leagueOfTeam(x.team)}</small></td><td>${x.w}</td><td>${x.l}</td><td>${x.w+x.l?(x.w/(x.w+x.l)).toFixed(3):'—'}</td></tr>`).join('')}</table>`,'col12');
}

function v12PostseasonPanel(){
 const ps=S.postseason||{};if(!ps.active)return '';
 return panel('ポストシーズン',`<div class="v12-playoff-card ${ps.champion?'v12-champ':''}"><div class="v12-playoff-head"><span>${v12SeriesLabel(ps.stage)}</span><span>${ps.wins}勝 ${ps.losses}敗</span></div><p>${team()} vs ${ps.opponent}</p><p class="muted">${ps.stage===1?'2勝先取':ps.stage===2?'2勝先取':'4勝先取'} / 第${ps.game+1}戦</p><button class="primary" onclick="v12PostGame()">次の試合へ</button></div>${(ps.history||[]).slice(0,8).map(g=>`<div class="statrow"><span>${v12SeriesLabel(g.stage)} 第${g.game}戦</span><b>${team()} ${g.my}-${g.oppScore} ${g.opponent} ${g.won?'○':'●'}</b></div>`).join('')}`,'col12');
}
const __v12_oldSeason=season;
season=function(){
 if(S.phase==='postseason'){
  const st=[...S.standings].filter(x=>leagueOfTeam(x.team)===leagueOfIndex(S.team)).sort((a,b)=>(b.w-b.l)-(a.w-a.l));
  const rankRows=st.map((x,i)=>`<tr><td>${i+1}</td><td>${x.team}</td><td>${x.w}</td><td>${x.l}</td></tr>`).join('');
  return `<div class="page-title"><div><h1>ポストシーズン</h1><div class="date">${leagueOfIndex(S.team)} / ${S.year}年 / ${v12SeriesLabel(S.postseason.stage)}</div></div><div class="actions"><button class="primary" onclick="v12PostGame()">次の試合へ</button><button onclick="advanceToSeasonEnd()">シーズン終了まで</button></div></div><div class="grid">${v12LeagueResultsPanel().replace('class="panel col4"','class="panel col12"')}${v12PostseasonPanel()}${panel('レギュラーシーズン最終順位',`<table><tr><th>順位</th><th>球団</th><th>勝</th><th>敗</th></tr>${rankRows}</table>`,'col6')}${panel('ポストシーズン記録',`<div class="v7-history">${(S.postseason.history||[]).slice(0,12).map(g=>`<div class="v12-record"><b>${v12SeriesLabel(g.stage)} 第${g.game}戦</b><span>${team()} ${g.my}-${g.oppScore} ${g.opponent}</span><b>${g.won?'勝利':'敗戦'}</b></div>`).join('')}</div>`,'col6')}</div>`;
 }
 const all=[...S.standings];
 const cl=all.filter(x=>leagueOfTeam(x.team)==='セ・リーグ').sort((a,b)=>(b.w-b.l)-(a.w-a.l));
 const pl=all.filter(x=>leagueOfTeam(x.team)==='パ・リーグ').sort((a,b)=>(b.w-b.l)-(a.w-a.l));
 const tableRows=list=>list.map((x,i)=>`<tr class="${x.team===team()?'me':''}"><td class="rank">${i+1}</td><td>${x.team}</td><td>${x.w}</td><td>${x.l}</td><td>${x.w+x.l?(x.w/(x.w+x.l)).toFixed(3):'—'}</td></tr>`).join('');
 const clTable=`<table><tr><th>順位</th><th>球団</th><th>勝</th><th>敗</th><th>勝率</th></tr>${tableRows(cl)}</table>`;
 const plTable=`<table><tr><th>順位</th><th>球団</th><th>勝</th><th>敗</th><th>勝率</th></tr>${tableRows(pl)}</table>`;
 const cal=seasonCalendar(S.year);
 const currentKey=gameDateKey(S.year,S.month,S.day);
 const idx=cal.indexOf(currentKey);
 const interStartKey=cal[48]||'9999/99/99';
 const inter=idx>=0&&isInterleagueIndex(idx);
 const currentNum=Number(S.month)*100+Number(S.day);
 const openingReached=currentNum>=327 || S.phase!=='regular';
 const interleagueReached=currentNum>=526 || S.phase==='postseason' || S.phase==='offseason';
 const csReached=currentNum>=1010 || S.phase==='postseason' || S.phase==='offseason';
 const draftReached=currentNum>=1022 || S.phase==='offseason';
 const japanReached=currentNum>=1024 || S.phase==='offseason';
 const seasonEndReached=currentNum>=1102 || S.phase==='offseason';
 const ops=[];
 ops.push(`<button class="day-advance-btn" onclick="advanceDay()">1日進める</button>`);
 ops.push(`<button class="month-advance-btn" onclick="advanceMonth()">次月まで</button>`);
 if(!openingReached) ops.push(`<button onclick="advanceToOpening()">開幕戦まで</button>`);
 if(!interleagueReached) ops.push(`<button onclick="advanceToInterleague()">交流戦まで</button>`);
 if(!csReached) ops.push(`<button onclick="advanceToCS()">CSまで</button>`);
 if(!draftReached) ops.push(`<button onclick="advanceToDraft()">ドラフトまで</button>`);
 if(!japanReached) ops.push(`<button onclick="advanceToJapanSeries()">日本シリーズまで</button>`);
 if(!seasonEndReached) ops.push(`<button onclick="advanceToSeasonEnd()">シーズン終了まで</button>`);
 const opsHtml=`<div class="season-actions-grid-v10">${ops.join('')}</div>`;
 const actionPanel=panel('シーズン操作',opsHtml,'col6');
 const upcoming=[
  [301,'春季キャンプ・オープン戦'],[401,'レギュラーシーズン開幕'],[602,'セ・パ交流戦'],[719,'オールスター期間'],[1001,'シーズン終盤'],[1025,'ドラフト会議（予定）'],[1101,'FA・補強シーズン（予定）'],[1201,'契約更改・来季編成']
 ].map(([k,label])=>({k,label})).filter(x=>x.k>=S.month*100+S.day).slice(0,4);
 const calendarPanel=panel('今後の主な日程',upcoming.length?`<div class="v7-history">${upcoming.map(x=>`<div class="v12-record"><b>${S.year}年${Math.floor(x.k/100)}月${x.k%100}日</b><span>${x.label}</span></div>`).join('')}</div>`:'<div class="muted">今季の主な日程を消化しました。次のシーズン準備へ進みます。</div>','col4');
 const playerPanel=panel('個人成績',`<table><tr><th>選手</th><th>位置</th><th>登録</th><th>試合</th><th>打率</th><th>HR</th><th>打点</th><th>勝</th><th>S</th><th>防御率</th></tr>${S.players.slice().sort((a,b)=>(b.type==='野手'?(b.hr||0):(b.wins||0))-(a.type==='野手'?(a.hr||0):(a.wins||0))).slice(0,12).map(p=>`<tr><td>${p.name}</td><td>${p.pos}</td><td>${p.squad}</td><td>${p.games}</td><td>${p.type==='野手'?(p.avg||0).toFixed(3):'—'}</td><td>${p.type==='野手'?p.hr||0:'—'}</td><td>${p.type==='野手'?p.rbi||0:'—'}</td><td>${p.type==='投手'?p.wins||0:'—'}</td><td>${p.type==='投手'?p.saves||0:'—'}</td><td>${p.type==='投手'&&p.ip?(9*p.er/p.ip).toFixed(2):'—'}</td></tr>`).join('')}</table>`,'col8');
 const resultsPanel=v12LeagueResultsPanel().replace('class="panel col4"','class="panel schedule-results-panel"');
 const standingsCl=panel('セ・リーグ順位表',clTable,'col6 schedule-standings-panel');
 const standingsPl=panel('パ・リーグ順位表',plTable,'col6 schedule-standings-panel');
 const resultAndOps=`<div class="schedule-command-row"><div class="schedule-half schedule-results-half">${resultsPanel}</div><div class="schedule-half schedule-ops-half">${actionPanel}</div></div>`;
 const standingsRow=`<div class="schedule-standings-row">${standingsCl}${standingsPl}</div>`;
 return `<div class="page-title"><div><h1>日程表</h1><div class="date">${leagueOfIndex(S.team)} / ${S.year}年${S.month}月${S.day}日 / ${S.seasonGames||0}試合消化${inter?' / 交流戦':''}</div></div></div>${resultAndOps}${standingsRow}<div class="grid schedule-lower-grid">${calendarPanel}${v12InterleaguePanel()}${playerPanel}${panel('試合ログ',gameLogPanel(10),'col12')}</div>`;
};
views.season=season;

function v12HistoryPanel(){const hist=S.history||[];return panel('年度別球団史',hist.length?`<div class="v7-history">${hist.slice(0,20).map(h=>`<div class="v12-record"><b>${h.year}年</b><span>${h.rank}位 / ${h.wins}勝${h.losses}敗 ${h.champ?' / 日本一':''}</span><b>${h.mvp||'—'}</b></div>`).join('')}</div>`:'<div class="muted">まだシーズンを完走していません。</div>','col8')}
function v12AwardsPanel(){const a=S.awards||[];return panel('直近シーズン個人タイトル',a.length?`<div class="v7-history">${a.map(x=>`<div class="v12-record"><b>${x.title}</b><span>${x.name}</span><b>${x.value}</b></div>`).join('')}</div>`:'<div class="muted">シーズン終了後に記録されます。</div>','col4')}
function v12HallPanel(){return panel('球団殿堂・引退選手',`<div>${(S.hallOfFame||[]).slice(0,8).map(x=>`<div class="v12-retire"><b>殿堂</b> ${x.name}<br><span class="muted">${x.year}年 / ${x.reason}</span></div>`).join('')||'<div class="muted">殿堂入り選手はいません。</div>'}</div><hr><div>${(S.retiredPlayers||[]).slice(0,8).map(x=>`<div class="v12-retire"><b>${x.name}</b> / ${x.age}歳 / ${x.type}<br><span class="muted">通算安打 ${x.careerHits} / 本塁打 ${x.careerHR}</span></div>`).join('')||'<div class="muted">引退選手はいません。</div>'}</div>`,'col12')}
const __v12_oldFinance=finance;
finance=function(){
 const base=__v12_oldFinance();
 return base.replace('</div></div>','</div></div>')+`<div class="grid">${v12HistoryPanel()}${v12AwardsPanel()}${v12HallPanel()}</div>`;
};
views.finance=finance;

// ===== v12+: news / club records / player album =====
function v12Defaults(){
  S.postseason=S.postseason||{active:false,stage:0,game:0,wins:0,losses:0,opponent:'',champion:null,history:[]};
  S.awards=S.awards||[];
  S.leagueRecords=S.leagueRecords||{};
  S.hallOfFame=S.hallOfFame||[];
  S.retiredPlayers=S.retiredPlayers||[];
  S.clubRecords=S.clubRecords||{wins:0,losses:0,hr:0,hits:0};
  S.news=S.news||[];
  S.playerAlbum=S.playerAlbum||[];
  S.phase=S.phase||'regular';
}
function v12NewsPanel(){
 const n=S.news||[];
 return panel('球界ニュース',n.length?`<div class="v7-history">${n.slice(0,12).map((x,i)=>`<div class="v12-record"><b>${S.year}年</b><span>${x}</span><small>#${i+1}</small></div>`).join('')}</div>`:'<div class="muted">まだ球界ニュースはありません。</div>','col12');
}
function v12RecordsPanel(){
 const h=S.history||[];
 const bestWins=h.length?Math.max(...h.map(x=>x.wins||0)):0;
 const bestLoss=h.length?Math.min(...h.map(x=>x.losses||0)):0;
 const titles=h.reduce((a,x)=>a+(x.awards||[]).length,0);
 const champs=h.filter(x=>x.champ).length;
 return panel('球団歴代記録',`<div class="v11-summary"><div><span>日本一</span><b>${champs}回</b></div><div><span>最多勝利</span><b>${bestWins}勝</b></div><div><span>最少敗戦</span><b>${bestLoss}敗</b></div><div><span>個人タイトル</span><b>${titles}個</b></div></div>`,'col12');
}
function v12AlbumPanel(){
 const ids=S.playerAlbum||[];
 const players=ids.map(id=>S.players.find(p=>p.id===id)||null).filter(Boolean);
 return panel('選手アルバム',players.length?players.map(p=>`<div class="v12-retire"><b>${p.name}</b> / ${p.age}歳 / ${p.type}<br><span class="muted">総合 ${ov(p)} / ${p.pos} / ${p.squad||'1軍'}</span></div>`).join(''):'<div class="muted">選手詳細からお気に入り登録すると、ここに残せます。</div>','col12');
}
function v12ToggleAlbum(p){
 v12Defaults();
 const i=S.playerAlbum.indexOf(p.id);
 if(i>=0)S.playerAlbum.splice(i,1);else S.playerAlbum.unshift(p.id);
 autoSave();render();
}
const __v12_oldPlayerData=playerDataScreen;
playerDataScreen=function(p){
 let html=__v12_oldPlayerData(p);
 const fav=S.playerAlbum.includes(p.id);
 const marker=`<button class="small-btn" onclick="v12ToggleAlbum(S.players.find(x=>x.id===${p.id}))">${fav?'★ アルバム登録済み':'☆ 選手アルバムに登録'}</button>`;
 html=html.replace(/(<h1>[^<]+<\/h1>)/,`$1${marker}`);
 return html;
};

// Finance becomes the long-term history hub.
const __v12_oldFinance2=finance;
finance=function(){
 const base=__v12_oldFinance2();
 return base+`<div class="grid">${v12RecordsPanel()}${v12HistoryPanel()}${v12AwardsPanel()}${v12HallPanel()}${v12AlbumPanel()}${v12NewsPanel()}</div>`;
};
views.finance=finance;

// Ensure newly created/loaded saves have v12 fields.
v12Defaults();
S.version='v12.5';
render();

function v13ReturnToTitle(){
  try{ if(typeof autoSave==="function") autoSave(); }catch(e){}
  try{ if(typeof closeMenu==="function") closeMenu(); }catch(e){}
  screen="title";
  try{ render(); }catch(e){}
}


function v13UpdateSeasonOps(){
 const root=document.querySelector('.season-ops-legacy');
 if(root) return;
}


document.addEventListener("click",function(e){
  try{
    if(e.target && e.target.closest && e.target.closest(".season-ops-v13")){
      setTimeout(v13UpdateSeasonOps,0);
    }
  }catch(_){}
});

<script>
/* BGM8.14: event-date skips / title load slot selector / default start tab */
function openLoadScreen(){screen='menu';menuMode='load';render()}
function loadScreen(){
  const slots=[1,2,3,4,5].map(function(i){
    const d=slotInfo(i);
    return '<div class="load-slot"><strong>セーブデータ '+i+'</strong>'+
      '<div class="slot-meta">'+(d ? (d.year+'年'+d.month+'月'+d.day+'日 / '+d.wins+'勝'+d.losses+'敗 / '+teams[d.team]) : '空きスロット')+'</div>'+
      '<div class="save-actions">'+(d ? '<button class="primary" onclick="loadSlot('+i+')">このデータをロード</button>' : '<span class="muted">この枠にはデータがありません。</span>')+'</div></div>';
  }).join('');
  return '<div class="menu-screen"><div class="page-title"><div><h1>つづきから</h1><div class="date">読み込むセーブデータを選択してください</div></div><button onclick="returnTitle()">タイトルへ戻る</button></div><div class="panel"><div class="panel-title">セーブデータ選択</div><div class="panel-body load-slot-grid">'+slots+'</div></div><div class="panel"><div class="panel-body"><div class="notice">手動セーブは5枠。自動セーブは別に保存されています。</div></div></div></div>';
}
function menuScreen(){
  if(menuMode==='save')return saveScreen();
  if(menuMode==='load')return loadScreen();
  return '<div class="menu-screen"><div class="page-title"><div><h1>メニュー</h1><div class="date">ゲームメニュー</div></div></div><div class="panel"><div class="panel-title">操作</div><div class="panel-body menu-grid"><button class="primary" onclick="saveNow()">セーブ</button><button onclick="openSaveScreen()">セーブデータ管理</button><button onclick="menuBack()">ゲームに戻る</button><button onclick="v13ReturnToTitle()">タイトル画面へ</button></div></div></div>';
}
function patchGameTabToSchedule(){tab='season';window.rosterMode='list';window.selectedRosterId=null;}
function startNewGame(teamIdx){
  const chosen=Number.isInteger(teamIdx)?Math.max(0,Math.min(11,teamIdx)):(typeof window.newTeamChoice==='number'?window.newTeamChoice:0);
  S=gameV7New(chosen);S.team=chosen;S.interleagueRecords=teams.map(function(t){return {team:t,w:0,l:0};});
  S.cpuTeams.forEach(function(c,i){c.style=i===S.team?'バランス型':CPU_STYLES[i%CPU_STYLES.length]});
  window.newTeamChoice=chosen;screen='setup';patchGameTabToSchedule();render();
}
function confirmNewGameSetup(){
  S.cpuTeams.forEach(function(c,i){if(i!==S.team){const el=document.getElementById('cpuStyle'+i);if(el)c.style=el.value;}});
  S.cpuTeams.forEach(function(c){c.budget=26000+R(0,14000);c.strength=48+R(-5,8);c.needs=v11Needs(c.style)});
  S.players.forEach(function(p){v11EnsurePlayer(p);v11RecordSnapshot(p,S.year,true);});
  S.version=V11_VERSION;S.news.unshift('新規ペナントを開始しました。CPU球団の編成方針を設定しました。');
  screen='game';patchGameTabToSchedule();lastBgmSeason=bgmSeason();autoSave();startBgm('game');render();
}
function continueGame(){openLoadScreen()}
function loadSlot(i){
  const data=slotInfo(i);if(!data){alert('このセーブ枠にはデータがありません。');return}
  if(!confirm('セーブデータ'+i+'をロードしますか？'))return;
  try{S=data;migrate();migrateV7();screen='game';patchGameTabToSchedule();startBgm('game');render();}
  catch(e){console.error('loadSlot failed',e);alert('セーブデータを読み込めませんでした。壊れたデータの可能性があります。')}
}
function jumpForwardTo(month,day,label,opts){
  opts=opts||{};v12Defaults();
  const target=gameDateKey(S.year,month,day), now=gameDateKey(S.year,S.month,S.day);
  if(now<target && S.phase==='regular'){
    let guard=0;while(S.phase==='regular' && gameDateKey(S.year,S.month,S.day)<target && guard<360){advanceDay();guard++;}
  }
  setGameDateTarget(month,day);
  if(label)S.news.unshift(S.year+'年'+month+'月'+day+'日の'+label+'まで進めました。');
  if(opts.phase)S.phase=opts.phase;
  render();autoSave();
}
function ensurePostseasonAtCSDate(){
  v12Defaults();
  const myLeague=leagueOfIndex(S.team), leagueIdx=myLeague==='セ・リーグ'?CENTRAL_TEAMS:PACIFIC_TEAMS;
  const st=[...S.standings].filter(function(x){return leagueIdx.includes(teams.indexOf(x.team));}).sort(function(a,b){return (b.w-b.l)-(a.w-a.l);});

<script>
/* BGM8.17 schedule cleanup:

   - Regular-season game calendar starts 3/27
   - Remove 1-week advance UI

*/
(function(){
  const __origSeasonCalendar = seasonCalendar;
  window.seasonCalendar = function(year){
    year=Number(year)||2026;
    // NPB 2026を基準にした「実戦日に近い」143試合日カレンダー。
    // 月曜は原則移動日。ただし公式に試合が組まれている特別日は残す。
    const special = new Set([
      gameDateKey(year,3,27),
      // 交流戦 18試合日
      ...Array.from({length:20},(_,i)=>gameDateKey(year,5,26+i)).filter(k=>{
        const d=new Date(k.replace(/-/g,'/')); return true;
      })
    ]);
    // 交流戦は5/26〜6/14（18試合日）
    const inter=[];
    for(let d=new Date(year,4,26); d<=new Date(year,5,14); d.setDate(d.getDate()+1)){
      if(d.getDay()!==1) inter.push(gameDateKey(year,d.getMonth()+1,d.getDate()));
    }
    // 通常期間は、NPBの日程感に合わせて「火〜日を中心に試合、適宜追加の休養日」。
    const normal=[];

      const k=gameDateKey(year,d.getMonth()+1,d.getDate());
      if(d.getDay()!==1 && !inter.includes(k)) normal.push(k);
    }
    // NPBの143試合制に合わせ、交流戦18日を除いた通常日から23日を休養日にする。
    // 3/27〜3/29の開幕3連戦は必ず試合日として残す。
    const opening = new Set([3,4,5].map(d=>gameDateKey(year,3,d)));
    const targetNormal=125;
    const dropCount=Math.max(0,normal.length-targetNormal);
    const regularNormal=[];
    let dropped=0;
    for(let i=0;i<normal.length;i++){
      const k=normal[i];
      if(opening.has(k)){ regularNormal.push(k); continue; }
      // シーズン全体に休養日を分散させる。開幕直後を避ける。
      const remaining=normal.length-i;
      const need=dropCount-dropped;
      const shouldDrop=need>0 && i>=3 && (Math.floor((i-3)*need/Math.max(1,remaining)) > Math.floor((i-4)*need/Math.max(1,remaining)));
      if(shouldDrop) dropped++; else regularNormal.push(k);
    }
    // 念のため125日へ正規化
    while(regularNormal.length>targetNormal){
      const idx=Math.min(regularNormal.length-1, regularNormal.length-2);
      if(opening.has(regularNormal[idx])) break;
      regularNormal.splice(idx,1);
    }
    while(regularNormal.length<targetNormal){
      const missing=normal.find(k=>!regularNormal.includes(k));
      if(!missing)break; regularNormal.push(missing);
    }
    return [...new Set([...regularNormal,...inter])].sort();
  };

  // 初期化・ロード時も「3/27開幕戦」を正とする。
  const __oldPlayGameDay = playGameDay;
  window.playGameDay = function(){

      keyPlays:[`${team()} ${myScore}-${oppScore} ${teams[sch.opponent]}。`],pitcherLine:'—',duration:`${R(2,4)}時間${R(5,59)}分`,gameNo:(S.gameNo||0)+1});

    S.news.push(`${S.year}年${S.month}月${S.day}日：${team()} ${myScore}-${oppScore} ${teams[sch.opponent]}。`);
    return true;
  };

  function safeDateMove(month,day,label,phase){

/* BGM8.18: canonical 2026 schedule + All-Star / Nippon Series event simulation */
(function(){

    const out=[]; for(let d=new Date(year,startM-1,startD); d<=new Date(year,endM-1,endD); d.setDate(d.getDate()+1)){
      if(d.getDay()!==1) out.push(keyOf(year,d.getMonth()+1,d.getDate()));
    } return out;
  }
  function chooseDates(pool,n,forced){
    const chosen=[]; const set=new Set();
    (forced||[]).forEach(k=>{if(pool.includes(k)&&!set.has(k)){set.add(k);chosen.push(k)}});
    const remaining=pool.filter(k=>!set.has(k));
    const need=Math.max(0,n-chosen.length);
    if(need>0){
      for(let i=0;i<need;i++){
        const idx=Math.floor(i*(remaining.length-1)/Math.max(1,need-1));
        const k=remaining[idx]; if(k&&!set.has(k)){set.add(k);chosen.push(k)}
      }
    }
    if(chosen.length<n){for(const k of remaining){if(!set.has(k)){set.add(k);chosen.push(k);if(chosen.length>=n)break}}}
    return chosen.slice(0,n).sort();
  }

    const prePool=makeDates(year,3,27,5,24);
    const inter=[];
    for(let d=new Date(year,4,26); d<=new Date(year,5,14); d.setDate(d.getDate()+1)){
      if(d.getDay()!==1) inter.push(keyOf(year,d.getMonth()+1,d.getDate()));
    }
    const postPool=makeDates(year,6,16,10,4);
    const preForced=[27,28,29].map(d=>keyOf(year,3,d)).concat([keyOf(year,3,31),keyOf(year,4,1),keyOf(year,4,2),keyOf(year,4,3),keyOf(year,4,4),keyOf(year,4,5)]);
    const pre=chooseDates(prePool,48,preForced);

  const __abbr18=window.v12TeamAbbr;

    const events=[...(S.eventGameLogs||[])];

  };

  const __season18=window.season;

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ペナントマネージャー NEXT</title>
<style>
:root{
  --bg:#10131a;--panel:#1b202a;--panel2:#242b37;--line:#3b4656;
  --text:#f3f5f7;--muted:#aeb7c4;--accent:#62b0ff;--good:#72d39a;--warn:#f0c66b;--danger:#ef7777;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:6px;cursor:pointer}
button:hover{filter:brightness(1.15)} button.primary{background:#285d92;border-color:#4f8bc3} button.danger{background:#6e3030}
#app{max-width:1180px;margin:auto;min-height:100vh}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0} header small{color:var(--muted)}
.screen{padding:22px 20px}.hidden{display:none}
.title{min-height:80vh;display:grid;place-items:center}.title-box{text-align:center}.title-box h2{font-size:42px;margin:0 0 10px}.title-box p{color:var(--muted);margin:0 0 28px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.team-card{padding:16px;text-align:left}.team-card strong{display:block;font-size:17px;margin-bottom:6px}.team-card span{color:var(--muted);font-size:13px}
.team-card.selected{outline:2px solid var(--accent)}
.topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button.active{background:#315b7d}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h3{margin:0 0 12px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #313947;text-align:left}th{color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}.badge{display:inline-block;padding:2px 7px;border-radius:10px;background:#303946;color:#d8dee7;font-size:12px}
.notice{padding:10px 12px;background:#202934;border-left:3px solid var(--accent);margin:10px 0;color:#dfe6ee}
.match{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #313947}.match:last-child{border-bottom:0}
.match .teams{flex:1}.match .score{min-width:70px;text-align:right;font-weight:700}.win{color:var(--good)}.loss{color:var(--danger)}
footer{padding:20px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:760px){.team-grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.title-box h2{font-size:30px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* =========================================================
   PENNANT MANAGER NEXT
   Phase 1: state / schedule / simulation / standings / save-load
   ========================================================= */

const TEAMS = [
  {id:"tigers", name:"阪神タイガース", league:"セ", power:84},
  {id:"carp", name:"広島東洋カープ", league:"セ", power:74},
  {id:"baystars", name:"横浜DeNAベイスターズ", league:"セ", power:80},
  {id:"giants", name:"読売ジャイアンツ", league:"セ", power:82},
  {id:"swallows", name:"東京ヤクルトスワローズ", league:"セ", power:72},
  {id:"dragons", name:"中日ドラゴンズ", league:"セ", power:70},
  {id:"hawks", name:"福岡ソフトバンクホークス", league:"パ", power:86},
  {id:"fighters", name:"北海道日本ハムファイターズ", league:"パ", power:81},
  {id:"marines", name:"千葉ロッテマリーンズ", league:"パ", power:76},
  {id:"eagles", name:"東北楽天ゴールデンイーグルス", league:"パ", power:71},
  {id:"buffaloes", name:"オリックス・バファローズ", league:"パ", power:79},
  {id:"lions", name:"埼玉西武ライオンズ", league:"パ", power:68}
];

const SAVE_KEY = "pennant_manager_next_v1";
let state = null;
let selectedTeam = TEAMS[0].id;

const $ = id => document.getElementById(id);
const team = id => TEAMS.find(t=>t.id===id);

function isoDate(y,m,d){ return new Date(Date.UTC(y,m-1,d)); }
function dateStr(dt){
  const w=["日","月","火","水","木","金","土"];
  return `${dt.getUTCFullYear()}/${String(dt.getUTCMonth()+1).padStart(2,"0")}/${String(dt.getUTCDate()).padStart(2,"0")}（${w[dt.getUTCDay()]}）`;
}
function clone(x){return JSON.parse(JSON.stringify(x));}

function freshState(controlTeam){
  const teams = {};
  TEAMS.forEach(t=>teams[t.id]={id:t.id,wins:0,losses:0,ties:0,runsFor:0,runsAgainst:0,streak:"-"});
  return {
    version:1, year:2026, currentDate:"2026-03-27T00:00:00Z",
    phase:"regular-preseason", controlTeam,
    teams, games:[], generated:false, history:[],
    lastMessage:"ゲームを開始しました。"
  };
}

/* ---------- Schedule ---------- */
function generateSchedule(){
  // Deterministic round-robin skeleton. The first 3/27 card is fixed,
  // later cards are generated from rotating pairings.
  const games=[];
  const start=isoDate(2026,3,27), end=isoDate(2026,10,4);
  let dayIndex=0;
  const pairsByLeague = {};
  for(const league of ["セ","パ"]){
    const ids=TEAMS.filter(t=>t.league===league).map(t=>t.id);
    pairsByLeague[league]=[];
    for(let r=0;r<ids.length-1;r++){
      for(let i=0;i<ids.length;i++){
        const a=ids[i], b=ids[(i+r+1)%ids.length];
        if(i<((i+r+1)%ids.length)) pairsByLeague[league].push([a,b]);
      }
    }
  }
  // Create a useful daily skeleton: Mon is a travel/off day; Tue-Sun have 3 games.
  for(let dt=new Date(start); dt<=end; dt.setUTCDate(dt.getUTCDate()+1)){
    if(dt.getUTCDay()===1) continue;
    const ds=dt.toISOString().slice(0,10);
    const round=Math.floor((dt-start)/86400000);
    ["セ","パ"].forEach((league,li)=>{
      const pairs=pairsByLeague[league];
      const p0=(round*3+li*2)%pairs.length;
      for(let k=0;k<3;k++){
        const p=pairs[(p0+k)%pairs.length];
        if(!p) continue;
        // Home/away alternates by round.
        const home=(round+k+li)%2===0?p[0]:p[1];
        const away=home===p[0]?p[1]:p[0];
        games.push({date:ds,home,away,played:false,homeScore:null,awayScore:null});
      }
    });
  }
  // Fixed opening day cards, replacing duplicate generated cards on 3/27.
  const opening = [
    ["tigers","giants"],["carp","baystars"],["swallows","dragons"],
    ["hawks","marines"],["fighters","eagles"],["buffaloes","lions"]
  ];
  const filtered=games.filter(g=>g.date!=="2026-03-27");
  opening.forEach(([home,away])=>filtered.push({date:"2026-03-27",home,away,played:false,homeScore:null,awayScore:null}));
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  return filtered;
}

function ensureSchedule(){
  if(!state.generated){state.games=generateSchedule();state.generated=true;}
}

/* ---------- Simulation ---------- */
function randn(){
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function scoreFor(powerDiff){
  const mean=3.1 + powerDiff/32;
  let x=Math.round(mean + randn()*1.9);
  return Math.max(0,Math.min(15,x));
}
function playGame(g){
  const h=team(g.home), a=team(g.away);
  const diff=(h.power-a.power)+2.5;
  let hs=scoreFor(diff), as=scoreFor(-diff);
  // Avoid excessive ties but allow them.
  if(hs===as && Math.random()<0.55){
    if(Math.random()<0.5) hs++; else as++;
  }
  g.played=true;g.homeScore=hs;g.awayScore=as;
  const H=state.teams[g.home], A=state.teams[g.away];
  H.runsFor+=hs;H.runsAgainst+=as;A.runsFor+=as;A.runsAgainst+=hs;
  if(hs>as){H.wins++;A.losses++;H.streak="W";A.streak="L";}
  else if(as>hs){A.wins++;H.losses++;A.streak="W";H.streak="L";}
  else {H.ties++;A.ties++;H.streak="T";A.streak="T";}
}

function gamesOn(date){return state.games.filter(g=>g.date===date);}
function simulateCurrentDay(){
  ensureSchedule();
  const gs=gamesOn(state.currentDate.slice(0,10));
  gs.forEach(g=>{if(!g.played)playGame(g);});
  const dt=new Date(state.currentDate); dt.setUTCDate(dt.getUTCDate()+1);
  state.currentDate=dt.toISOString();
  state.lastMessage=gs.length
    ? `${gs.length}試合をシミュレートしました。`
    : "今日は試合がありません。";
  updatePhase();
}
function simulateUntilNextGame(){
  ensureSchedule();
  let dt=new Date(state.currentDate);
  for(let i=0;i<40;i++){
    const ds=dt.toISOString().slice(0,10);
    if(gamesOn(ds).length){state.currentDate=dt.toISOString();return;}
    dt.setUTCDate(dt.getUTCDate()+1);
  }
}
function updatePhase(){
  const d=state.currentDate.slice(0,10);
  if(d<"2026-03-27")state.phase="before";
  else if(d<="2026-10-04")state.phase="regular";
  else state.phase="offseason";
}

function standings(league){
  return TEAMS.filter(t=>t.league===league).map(t=>({...t,...state.teams[t.id]}))
    .sort((a,b)=>(b.wins-a.wins)||(a.losses-b.losses)||((b.runsFor-b.runsAgainst)-(a.runsFor-a.runsAgainst)));
}

/* ---------- Persistence ---------- */
function save(slot){
  localStorage.setItem(SAVE_KEY+"_"+slot,JSON.stringify(state));
  state.lastMessage=`セーブ${slot}に保存しました。`;
  renderGame();
}
function load(slot){
  const raw=localStorage.getItem(SAVE_KEY+"_"+slot);
  if(!raw){alert("このスロットにはセーブデータがありません。");return;}
  state=JSON.parse(raw);renderGame();
}
function saveExists(slot){return !!localStorage.getItem(SAVE_KEY+"_"+slot);}

/* ---------- UI ---------- */
function render(){
  if(!state) renderTitle(); else renderGame();
}
function renderTitle(){
  $("app").innerHTML=`
  <div class="title screen">
    <div class="title-box">
      <h2>PENNANT MANAGER</h2>
      <p>システム重視・ブラウザ型ペナントゲーム 開発版</p>
      <div class="actions">
        <button class="primary" onclick="showNewGame()">はじめから</button>
        <button onclick="showLoad()">つづきから</button>
      </div>
      <footer>Phase 1 / 日程・試合・順位・セーブシステム</footer>
    </div>
  </div>`;
}
function showNewGame(){
  $("app").innerHTML=`<header><h1>球団選択</h1><small>操作する球団を選択してください</small></header>
  <div class="screen">
    <div class="team-grid">${TEAMS.map(t=>`
      <button class="team-card ${t.id===selectedTeam?"selected":""}" onclick="selectTeam('${t.id}')">
        <strong>${t.name}</strong><span>${t.league}リーグ / 初期戦力 ${t.power}</span>
      </button>`).join("")}</div>
    <div class="actions">
      <button onclick="renderTitle()">戻る</button>
      <button class="primary" onclick="startNew()">この球団で開始</button>
    </div>
  </div>`;
}
function selectTeam(id){selectedTeam=id;showNewGame();}
function startNew(){state=freshState(selectedTeam);ensureSchedule();renderGame();}
function showLoad(){
  $("app").innerHTML=`<header><h1>つづきから</h1><small>セーブデータを選択</small></header>
  <div class="screen"><div class="panel">${[1,2,3,4,5].map(s=>{
    const raw=localStorage.getItem(SAVE_KEY+"_"+s);
    let label="空き";
    if(raw){try{const x=JSON.parse(raw);label=`${x.year}年 / ${x.currentDate.slice(0,10)} / ${team(x.controlTeam)?.name||""}`;}catch(e){}}
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #313947">
      <span>セーブ${s}　<span class="badge">${label}</span></span>
      ${raw?`<button onclick="load(${s})">ロード</button>`:`<button disabled>空き</button>`}
    </div>`;
  }).join("")}</div><div class="actions" style="margin-top:16px"><button onclick="renderTitle()">戻る</button></div></div>`;
}

function nav(active){
  return `<div class="nav">
    <button class="${active==="schedule"?"active":""}" onclick="renderGame('schedule')">日程</button>
    <button class="${active==="standings"?"active":""}" onclick="renderGame('standings')">順位</button>
    <button class="${active==="save"?"active":""}" onclick="renderGame('save')">セーブ</button>
  </div>`;
}

function renderGame(active="schedule"){
  ensureSchedule();updatePhase();
  const ct=team(state.controlTeam);
  $("app").innerHTML=`
  <header><div><h1>${ct.name}</h1><small>${state.year}年 / ${state.phase}</small></div><div>${dateStr(new Date(state.currentDate))}</div></header>
  <div class="screen">${nav(active)}
    <div style="margin:14px 0">${state.lastMessage?`<div class="notice">${state.lastMessage}</div>`:""}</div>
    ${active==="schedule"?scheduleView():active==="standings"?standingsView():saveView()}
  </div>
  <footer>この版はゲームシステムの土台。画面演出よりシミュレーション基盤を優先しています。</footer>`;
}

function scheduleView(){
  const ds=state.currentDate.slice(0,10), today=gamesOn(ds);
  const upcoming=state.games.filter(g=>!g.played && g.date>=ds).slice(0,18);
  return `<div class="grid2">
    <div class="panel">
      <h3>本日の試合　${ds}</h3>
      ${today.length?today.map(matchHTML).join(""):`<p style="color:var(--muted)">本日は試合がありません。</p>`}
      <div class="actions" style="margin-top:16px;justify-content:flex-start">
        <button class="primary" onclick="nextDay()">次の日へ</button>
        <button onclick="nextGameDay()">次の試合日へ</button>
      </div>
    </div>
    <div class="panel">
      <h3>直近の日程</h3>
      ${upcoming.map(g=>`<div class="match"><div class="teams"><small>${g.date}</small><br>${team(g.away).name} vs ${team(g.home).name}</div><div class="score">-</div></div>`).join("")}
    </div>
  </div>`;
}
function matchHTML(g){
  const mine=g.home===state.controlTeam||g.away===state.controlTeam;
  const hs=g.homeScore,as=g.awayScore;
  return `<div class="match">
    <div class="teams"><b class="${mine?"win":""}">${team(g.away).name}</b> vs <b>${team(g.home).name}</b></div>
    <div class="score">${g.played?`${as} - ${hs}`:"-"}</div>
  </div>`;
}
function nextDay(){simulateCurrentDay();renderGame("schedule");}
function nextGameDay(){simulateUntilNextGame();renderGame("schedule");}

function standingsView(){
  const row=(x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td class="num">${x.wins}</td><td class="num">${x.losses}</td><td class="num">${x.ties}</td><td class="num">${x.runsFor-x.runsAgainst>0?"+":""}${x.runsFor-x.runsAgainst}</td></tr>`;
  return `<div class="grid2">
    <div class="panel"><h3>セ・リーグ</h3><table><thead><tr><th>順位</th><th>球団</th><th class="num">勝</th><th class="num">敗</th><th class="num">分</th><th class="num">得失</th></tr></thead><tbody>${standings("セ").map(row).join("")}</tbody></table></div>
    <div class="panel"><h3>パ・リーグ</h3><table><thead><tr><th>順位</th><th>球団</th><th class="num">勝</th><th class="num">敗</th><th class="num">分</th><th class="num">得失</th></tr></thead><tbody>${standings("パ").map(row).join("")}</tbody></table></div>
  </div>`;
}
function saveView(){
  return `<div class="panel"><h3>セーブデータ</h3>
    ${[1,2,3,4,5].map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #313947">
      <span>セーブ${s}　${saveExists(s)?'<span class="badge">保存済み</span>':'<span class="badge">空き</span>'}</span>
      <button onclick="save(${s})">保存</button>
    </div>`).join("")}
    <div class="actions" style="margin-top:18px"><button class="danger" onclick="if(confirm('タイトル画面に戻りますか？')){state=null;renderTitle()}">タイトル画面に戻る</button></div>
  </div>`;
}

render();
</script>
</body>
</html>

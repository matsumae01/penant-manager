<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Meiryo,"Yu Gothic",system-ui,sans-serif;color:var(--ink)}body{background:linear-gradient(#edf3fb,#cfdbea)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #7186a5;border-radius:4px;background:linear-gradient(#fff,#e4ebf4);color:#17243b;padding:8px 12px;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.14)}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:linear-gradient(#ffe97e,#e7bb2d);border-color:#af8614;color:#16356d}.blue{background:linear-gradient(#4e86ca,#285a9e);color:#fff;border-color:#204d88}.red{background:linear-gradient(#f18a89,#d24d4d);color:#fff;border-color:#a53131}.hidden{display:none!important}.small{font-size:11px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}

let bgmAudio=null,bgmUnlocked=false,currentBgm="",currentBgmFile="",bgmSourceIndex=0,bgmRetryPending=false;const BGM_FALLBACK_ROOT="https://raw.githubusercontent.com/matsumae01/penant-manager/main/";

window.simulateGame=function(g){
  ensureV19State(state);ensureLineupsAll();
  const ah=teamAttack(g.away),hh=teamAttack(g.home),ap=teamPitch(g.away),hp=teamPitch(g.home);
  let as=Math.max(0,Math.round(3+(ah-hp)*.055+(Math.random()*3.8-1.9)));
  let hs=Math.max(0,Math.round(3+(hh-ap)*.055+(Math.random()*3.8-1.9)));
  if(as===hs){if(Math.random()<.5)as++;else hs++;}
  g.played=true;g.awayScore=as;g.homeScore=hs;
  const ar=state.teams[g.away],hr=state.teams[g.home];
  ar.runsFor+=as;ar.runsAgainst+=hs;hr.runsFor+=hs;hr.runsAgainst+=as;
  if(as>hs){ar.wins++;hr.losses++;ar.streak='W';hr.streak='L'}else{hr.wins++;ar.losses++;hr.streak='W';ar.streak='L'}
  updateHitterStats(g.away,as);updateHitterStats(g.home,hs);
  [g.away,g.home].forEach((tid,sideIdx)=>{
    const rot=rotationFor(tid),starter=rot[Math.floor(((state.games||[]).filter(x=>x.played&&(x.home===tid||x.away===tid)).length||0)/1)%5]||rot[0];
    if(starter){const own=sideIdx===0?as:hs,opp=sideIdx===0?hs:as;const ip=Math.min(8,Math.max(4.0,5.0+Math.random()*2.5));starter.ip+=ip;starter.er+=Math.max(0,own-Math.round(Math.random()*1.1));starter.so+=Math.max(0,Math.round(ip*(starter.velocity-134)/8+Math.random()*2.5));starter.era=starter.ip?starter.er*9/starter.ip:0;if(own>opp){starter.wins++;}}
    const relievers=teamPlayers(tid).filter(p=>p.pos==='P'&&!p.retired&&!p.minor&&!p.injury&&p.id!==starter?.id&&p.role!=='先発').sort((a,b)=>rating(b)-rating(a));
    if(relievers.length && sideIdx===0){const closer=relievers.find(p=>p.role==='抑え')||relievers[0];if(as<hs)closer.saves=(closer.saves||0)+1;}
  });
  wearAndTear(g.away);wearAndTear(g.home);
  [g.away,g.home].forEach(tid=>teamPlayers(tid).filter(p=>p.rookie&&p.reveal<100).forEach(p=>p.reveal=Math.min(100,p.reveal+1)));
  if(g.home===state.controlTeam||g.away===state.controlTeam){
    const won=(g.home===state.controlTeam&&hs>as)||(g.away===state.controlTeam&&as>hs);
    state.v19.lastResults.unshift({id:g.id,date:g.date,away:g.away,home:g.home,awayScore:as,homeScore:hs,won});
    state.v19.lastResults=state.v19.lastResults.slice(0,20);
    state.v19.resultHistory.unshift({id:g.id,date:g.date,away:g.away,home:g.home,awayScore:as,homeScore:hs});
    state.v19.resultHistory=state.v19.resultHistory.slice(0,120);
  }
};

function calcAwards(){

  const homers=all.filter(p=>p.pos!=='P').sort((a,b)=>b.hr-a.hr||b.rbi-a.rbi);
  const rbis=all.filter(p=>p.pos!=='P').sort((a,b)=>b.rbi-a.rbi);
  const pitchers=all.filter(p=>p.pos==='P'&&p.ip>=20).sort((a,b)=>(a.era-b.era)|| (b.wins-a.wins));
  const wins=all.filter(p=>p.pos==='P').sort((a,b)=>b.wins-a.wins||b.so-a.so);
  const rookies=all.filter(p=>p.rookie&&p.atBats>=60||p.rookie&&p.ip>=10).sort((a,b)=>overall(b)-overall(a)+(b.wins-a.wins)*2+(b.hr-a.hr));

  });

    const gh=(p.growthHistory||[]).slice().reverse();out+='<div class="section-label">能力成長履歴</div>'+(gh.length?gh.map(g=>'<div class="growth-card-v19"><b>'+g.year+'年度　'+g.age+'歳</b><div class="growth-grid-v19">'+Object.keys(g.after||{}).map(k=>{const d=g.delta?.[k]||0;return '<span>'+k+' <b>'+g.after[k]+'</b> <i class="'+(d>0?'up':d<0?'down':'same')+'">'+fmtDelta(d)+'</i></span>'}).join('')+'</div></div>').join(''):'<div class="notice">年度を完了すると能力成長履歴が記録されます。</div>');
  }else if(selectedPlayerTab==='season'){
    const c=p.pos==='P'?'<table class="table record-table-v19"><thead><tr><th>年度</th><th>勝</th><th>防御率</th><th>投球回</th><th>奪三振</th><th>S</th></tr></thead><tbody>': '<table class="table record-table-v19"><thead><tr><th>年度</th><th>打率</th><th>安打</th><th>本塁打</th><th>打点</th><th>打席</th></tr></thead><tbody>';
    out+='<div class="section-label">年度別成績</div>'+c+hist.map(h=>p.pos==='P'?'<tr><td>'+h.year+'</td><td>'+h.wins+'</td><td>'+Number(h.era||0).toFixed(2)+'</td><td>'+Number(h.ip||0).toFixed(1)+'</td><td>'+h.so+'</td><td>'+h.saves+'</td></tr>':'<tr><td>'+h.year+'</td><td>'+Number((h.atBats?h.hits/h.atBats:0)).toFixed(3).replace('0.','.')+'</td><td>'+h.hits+'</td><td>'+h.hr+'</td><td>'+h.rbi+'</td><td>'+h.atBats+'</td></tr>').join('')+'</tbody></table>';
  }else if(selectedPlayerTab==='career'){
    const c=p.career||{};out+='<div class="section-label">通算成績</div><div class="career-total-v19">'+(p.pos==='P'?'<div><b>'+c.totalWins+'</b><span>勝利</span></div><div><b>'+hist.reduce((a,x)=>a+(x.so||0),0)+'</b><span>奪三振</span></div><div><b>'+hist.reduce((a,x)=>a+(x.ip||0),0).toFixed(1)+'</b><span>投球回</span></div>':'<div><b>'+c.totalHits+'</b><span>安打</span></div><div><b>'+c.totalHR+'</b><span>本塁打</span></div><div><b>'+hist.reduce((a,x)=>a+(x.rbi||0),0)+'</b><span>打点</span></div>')+'</div><div class="section-label">獲得タイトル</div><div class="actions">'+(p.awards||[]).slice(0,12).map(a=>'<span class="award-badge">'+a.year+' '+a.name+'</span>').join('')+'</div>';
  }else{
    const rows=p.pos==='P'?[['球速',p.velocity+' km/h',Math.max(0,Math.min(100,(p.velocity-120)*2.2))],['コントロール',ability(p.control),p.control],['スタミナ',ability(p.stamina),p.stamina],['対ピンチ',ability(55+(p.control%35)),55+(p.control%35)],['奪三振',ability(48+(p.velocity-138)*2),48+(p.velocity-138)*2],['クイック',ability(42+(p.stamina%35)),42+(p.stamina%35)]]:[['弾道',String(p.trajectory),p.trajectory*25],['ミート',ability(p.contact),p.contact],['パワー',ability(p.power),p.power],['走力',ability(p.speed),p.speed],['肩力',ability(p.arm),p.arm],['守備力',ability(p.def),p.def],['捕球',ability(p.catching),p.catching]];
    out+='<div class="section-label">'+(p.pos==='P'?'投手能力':'野手能力')+'</div><div class="ability-grid-v19">'+rows.map(r=>'<div class="ability-row-v19"><span>'+r[0]+'</span><span>'+r[1]+'</span><div class="meter"><i style="width:'+Math.min(100,Math.max(0,r[2]))+'%"></i></div><b>'+Math.round(r[2])+'</b></div>').join('')+'</div><div class="section-label">特殊能力</div><div class="actions">'+p.special.map(x=>'<span class="skill-chip">'+x+'</span>').join('')+'</div><div class="section-label">契約・状態</div><div class="mini-grid"><div><small>年俸</small><b>'+p.salary.toLocaleString()+'万</b></div><div><small>契約</small><b>'+p.contractYears+'年</b></div><div><small>疲労</small><b>'+p.fatigue+'</b></div><div><small>成長タイプ</small><b>'+p.development+'</b></div></div>';
  }
  box.innerHTML=out+'</div>';
};

/* Result screen */
window.resultViewV19=function(){const g=state.lastResult;if(!g)return '<div class="notice">直近の試合結果はありません。</div>';const won=(g.home===state.controlTeam?g.homeScore>g.awayScore:g.awayScore>g.homeScore);const stars=gameStars(g);const ap=rotationFor(g.away),hp=rotationFor(g.home);return '<div class="screen-title"><div><h2>試合結果</h2><small>'+dateLabel(g.date)+'　'+team(g.away).name+' 対 '+team(g.home).name+'</small></div><span class="tag '+(won?'tag-win':'')+'">'+(won?'WIN':'GAME RESULT')+'</span></div><div class="result-panel-v19"><div class="result-sub">'+(won?'試合に勝利しました':'試合に敗れました')+'</div>'+resultScore(g)+'<div class="result-record-v19"><span>'+team(g.away).short+'　'+g.awayScore+'点</span><span>'+team(g.home).short+'　'+g.homeScore+'点</span></div></div><div class="grid2"><div class="panel"><div class="panel-head">試合ハイライト</div><div class="panel-body">'+(stars.map(x=>'<div class="market-row"><div><b>'+x.p.name+'</b><div class="small">'+(x.p.pos==='P'?'投手':'野手')+'</div></div><span class="award-badge">'+(x.p.pos==='P'?(x.p.wins?'勝利投手':'登板'):(x.p.hr?'本塁打':'安打'))+'</span></div>').join('')||'<div class="notice">注目選手データなし</div>')+'</div></div><div class="panel"><div class="panel-head">先発投手</div><div class="panel-body"><div class="mini-scoreboard"><b>'+team(g.away).short+'</b><span>'+ (ap[0]?ap[0].name:'－') +'</span><b>'+team(g.home).short+'</b></div><div class="small" style="margin-top:7px">先発ローテーションと起用法は「采配」から変更できます。</div></div></div></div><div class="actions" style="margin-top:10px"><button class="primary" onclick="safeRender(\'schedule\')">▶ 日程へ戻る</button><button onclick="safeRender(\'players\')">選手成績を見る</button><button onclick="safeRender(\'lineup\')">采配を確認</button></div>'};

window.v19LineupView=function(){
  const o=lineupFor(state.controlTeam),r=rotationFor(state.controlTeam),one=teamPlayers(state.controlTeam).filter(p=>!p.retired&&!p.minor),two=teamPlayers(state.controlTeam).filter(p=>!p.retired&&p.minor).sort((a,b)=>overall(b)-overall(a));
  let out='<div class="screen-title"><div><h2>采配</h2><small>オーダー・守備位置・投手起用・登録</small></div><span class="tag">ORDER</span></div><div class="pawa-screen-tabs"><button class="active">オーダー</button><button onclick="safeRender(\'players\')">選手能力</button></div><div class="order-shell-v19"><div class="order-list-v19"><div class="pawa-topline"><span>先発オーダー</span><span>1～9番</span></div>';
  o.forEach((p,i)=>{out+='<div class="order-row-v19"><b class="num">'+(i+1)+'</b>'+posSquareV14(p)+'<div class="nm"><b>'+p.name+'</b><small>'+formLabel(p)+' / 疲労 '+p.fatigue+'</small></div>'+ability(p.contact)+'<button onclick="moveOrder('+i+',-1)" '+(i===0?'disabled':'')+'>▲</button><button onclick="moveOrder('+i+',1)" '+(i===o.length-1?'disabled':'')+'>▼</button></div>'});
  out+='<div class="position-assign-v19"><b>守備位置を選手に割り当て</b><div class="assign-grid-v19">'+o.map(p=>'<div><span>'+posSquareV14(p)+'</span><select onchange="setFieldPos(\''+p.id+'\',this.value)"><option value="'+p.fieldPos+'" selected>'+p.fieldPos+'</option><option value="C">捕手</option><option value="1B">一塁</option><option value="2B">二塁</option><option value="SS">遊撃</option><option value="3B">三塁</option><option value="LF">左翼</option><option value="CF">中堅</option><option value="RF">右翼</option></select></div>').join('')+'</div></div><div class="actions"><button class="primary" onclick="autoLineup();renderGame(\'lineup\')">▶ おまかせ</button></div></div>';
  out+='<div class="lineup-side-v19"><div class="panel"><div class="panel-head">投手起用</div><div class="panel-body">'+r.map((p,i)=>'<div class="pitcher-row-v19"><div><b>'+ (i+1)+'. '+p.name+'</b><small>'+p.velocity+'km/h　疲労 '+p.fatigue+'</small></div>'+roleBadge(p.role)+'<button class="small-btn" onclick="moveRotation('+i+',-1)">▲</button><button class="small-btn" onclick="moveRotation('+i+',1)">▼</button><button class="small-btn" onclick="setCloser(\''+p.id+'\')">抑え</button></div>').join('')+'<div class="section-label">起用可能な投手</div>'+teamPlayers(state.controlTeam).filter(p=>p.pos==='P'&&!p.minor&&!p.injury&&!r.some(x=>x.id===p.id)).slice(0,8).map(p=>'<div class="market-row">'+posSquareV14(p)+'<b>'+p.name+'</b><span>'+overall(p)+'</span><button onclick="state.rotation[state.controlTeam].push(\''+p.id+'\');renderGame(\'lineup\')">ローテ</button></div>').join('')+'</div></div><div class="panel"><div class="panel-head">一軍・二軍</div><div class="panel-body"><div class="market-row"><b>一軍 '+one.length+'人</b><span>二軍 '+two.length+'人</span></div>'+two.slice(0,8).map(p=>'<div class="market-row">'+posSquareV14(p)+'<b>'+p.name+'</b><span>'+overall(p)+'</span><button onclick="promotePlayer(\''+p.id+'\')">一軍</button></div>').join('')+'</div></div></div></div></div>';
  return out;
};

window.v19MarketView=function(){
  const tab=state.v19.marketTab||'market';
  const tabs=['market','fa','draft','renew','release'];
  let out='<div class="screen-title"><div><h2>新戦力・球団編成</h2><small>トレード / FA / ドラフト / 契約更改 / 戦力外</small></div><span class="tag">FRONT OFFICE</span></div><div class="pawa-screen-tabs">'+tabs.map(x=>'<button class="'+(tab===x?'active':'')+'" onclick="state.v19.marketTab=\''+x+'\';safeRender(\'newstrength\')">'+({market:'トレード',fa:'FA交渉',draft:'ドラフト',renew:'契約更改',release:'戦力外'})[x]+'</button>').join('')+'</div>';
  if(tab==='market'){return out+_newStrengthView12();}
  if(tab==='fa'){const fa=(state.offseason.faList||[]).map(playerById).filter(p=>p&&p.freeAgent&&!p.retired);return out+'<div class="panel"><div class="panel-head">FA交渉</div><div class="panel-body">'+(fa.map(p=>'<div class="fa-card-v19"><div>'+posSquareV14(p)+' <b>'+p.name+'</b><small>'+p.age+'歳 / 能力 '+overall(p)+' / 希望 '+p.contractPreference+' / '+p.contractDemand.toLocaleString()+'万</small></div><div class="actions"><button onclick="signFA(\''+p.id+'\',2,'+Math.max(p.contractDemand,Math.round(p.salary*1.15))+')">2年提示</button><button class="primary" onclick="signFA(\''+p.id+'\',3,'+Math.max(p.contractDemand,Math.round(p.salary*1.25))+')">3年提示</button></div></div>').join('')||'<div class="notice">交渉可能なFA選手はいません。</div>')+'</div></div>';
  }
  if(tab==='draft'){const c=(state.offseason.candidates||[]).filter(p=>!p.drafted);return out+'<div class="panel"><div class="panel-head">ドラフト候補　能力判明システム</div><div class="panel-body"><div class="draft-head-v19"><span>守</span><span>候補</span><span>年齢</span><span>能力</span><span>判明</span><span>操作</span></div>'+c.map(p=>'<div class="draft-row-v19"><span>'+posSquareV14(p)+'</span><b>'+p.name+'</b><span>'+p.age+'歳</span><span>'+prospectStat(p,p.pos==='P'?'control':'contact')+'　'+prospectStat(p,p.pos==='P'?'stamina':'power')+'</span><span>'+p.scout+'%</span><span><button onclick="scoutPlayer(\''+p.id+'\')">調査</button><button class="primary" onclick="draftPlayer(\''+p.id+'\')">指名</button></span></div>').join('')+'</div></div>';
  }
  const exp=teamPlayers(state.controlTeam).filter(p=>!p.retired&&p.expiring);if(tab==='renew')return out+'<div class="panel"><div class="panel-head">契約更改</div><div class="panel-body">'+(exp.map(p=>'<div class="contract-row-v19"><div>'+posSquareV14(p)+'<b>'+p.name+'</b><small>'+p.age+'歳 / 現年俸 '+p.salary.toLocaleString()+'万 / 希望 '+p.contractDemand.toLocaleString()+'万 / '+p.contractPreference+'</small></div><div class="actions"><button onclick="renewContract(\''+p.id+'\',Math.round('+p.contractDemand+'*0.95),1)">1年契約</button><button class="primary" onclick="renewContract(\''+p.id+'\',Math.round('+p.contractDemand+'),2)">2年契約</button><button onclick="releasePlayer(\''+p.id+'\')">戦力外</button></div></div>').join('')||'<div class="notice">契約更改対象選手はいません。</div>')+'</div></div>';
  const cuts=teamPlayers(state.controlTeam).filter(p=>!p.retired).sort((a,b)=>rating(a)-rating(b));return out+'<div class="panel"><div class="panel-head">戦力外通告</div><div class="panel-body"><div class="notice warn">年齢・能力・年俸・二軍状況を見ながら自由契約選手を整理します。</div>'+cuts.slice(0,16).map(p=>'<div class="release-row-v19"><div>'+posSquareV14(p)+' <b>'+p.name+'</b><small>'+p.age+'歳 / 能力 '+overall(p)+' / '+p.salary.toLocaleString()+'万</small></div><button onclick="releasePlayer(\''+p.id+'\')">戦力外</button></div>').join('')+'</div></div>';
};

window.v19AwardsView=function(){
  ensureV19State(state);const a=state.v19.awards;let out='<div class="screen-title"><div><h2>タイトル・表彰</h2><small>年度記録・個人タイトル・日本一</small></div><span class="tag">AWARDS</span></div>';
  if(!a)return out+'<div class="notice">日本シリーズ終了後に今季タイトルが確定します。</div>';
  const items=[['MVP',a.mvp],['新人王',a.rookieKing],['首位打者',a.bestAverage],['本塁打王',a.homeRunKing],['打点王',a.rbiKing],['最優秀防御率',a.saiYoung],['最多勝',a.winLeader]];out+='<div class="award-grid-v19">'+items.map(x=>'<div class="award-card-v19"><span>'+x[0]+'</span><b>'+(x[1]?playerById(x[1])?.name||'－':'－')+'</b><small>'+state.year+'年度</small></div>').join('')+'</div><div class="panel" style="margin-top:10px"><div class="panel-head">日本シリーズ</div><div class="panel-body"><div class="result-banner">'+(a.champion?team(a.champion).name+' が日本一':'未確定')+'</div></div></div>';return out;
};
window.v19RecordsView=function(){
  const lg=team(state.controlTeam).league;const hs=TEAMS.flatMap(t=>teamPlayers(t.id).filter(p=>p.pos!=='P').map(p=>({p,t}))).sort((a,b)=>b.p.hr-a.p.hr).slice(0,12);const ps=TEAMS.flatMap(t=>teamPlayers(t.id).filter(p=>p.pos==='P'&&p.ip>0).map(p=>({p,t}))).sort((a,b)=>(a.p.era-b.p.era)).slice(0,12);return '<div class="screen-title"><div><h2>記録</h2><small>'+lg+'リーグ　個人成績・ランキング</small></div><span class="tag">RECORDS</span></div><div class="grid2"><div class="panel"><div class="panel-head">本塁打ランキング</div><div class="panel-body">'+hs.map((x,i)=>'<div class="market-row"><b>'+String(i+1).padStart(2,'0')+'　'+x.p.name+'</b><span>'+x.t.short+'　'+x.p.hr+'本</span></div>').join('')+'</div></div><div class="panel"><div class="panel-head">防御率ランキング</div><div class="panel-body">'+ps.map((x,i)=>'<div class="market-row"><b>'+String(i+1).padStart(2,'0')+'　'+x.p.name+'</b><span>'+x.t.short+'　'+(x.p.era||0).toFixed(2)+'</span></div>').join('')+'</div></div></div>';
};

/* Render V19 while retaining all existing title/save infrastructure. */
window.renderGame=function(a='schedule'){
  if(!state)return renderTitle();ensureV19State(state);ensureSchedule();ensureLineupsAll();currentView=a;const ct=team(state.controlTeam);const views={schedule:scheduleView,players:v19PlayersView,lineup:v19LineupView,newstrength:v19MarketView,teaminfo:teamInfoView,save:saveView,result:resultViewV19,awards:v19AwardsView,records:v19RecordsView};
  const pct=Math.round((state.games.filter(g=>g.played).length/858)*100);
  $('app').innerHTML='<header class="game-header game-header-v19"><div class="brand"><div class="brand-mark">PM</div><div><h1>'+ct.name+'</h1><small>'+state.year+'年度　'+phaseText()+'　｜　プレイ '+(state.seasonHistory.length+1)+'年目</small></div></div><div class="header-date"><b>'+fullDate(state.currentDate)+'</b><div class="header-tools"><button onclick="nextDay()">▶ 1日進む</button><button onclick="safeRender(\'schedule\')">日程表</button><button onclick="toggleBGM()">♪ BGM '+(state.settings.bgm?'ON':'OFF')+'</button></div></div></header><main class="screen"><div class="season-ribbon"><span class="phase">'+phaseText()+'</span><b>'+fullDate(state.currentDate)+'</b><span>操作球団：'+ct.name+'</span></div><div class="season-progress"><i style="width:'+pct+'%"></i></div>'+v14Nav(a)+'<div class="notice '+(state.lastMessage.includes('成立')||state.lastMessage.includes('保存')||state.lastMessage.includes('勝利')?'ok':'')+'">'+state.lastMessage+'</div><div class="v19-subtabs"><button onclick="safeRender(\'records\')">記録</button><button onclick="safeRender(\'awards\')">タイトル・表彰</button>'+(state.lastResult?'<button class="result-link" onclick="safeRender(\'result\')">直近の試合結果</button>':'')+'</div>'+(views[a]||scheduleView)()+'</main><footer class="v19-footer">ORIGINAL BROWSER PENNANT　/　Original UI homage　/　V19</footer>';
  if(a==='players')showPlayerV19(selectedPlayer);playBGM();
};

/* Daily progression: show result after a user's game, otherwise stay on schedule. */
window.nextDay=function(){
  if(!state)return renderTitle();unlockBGM();ensureV19State(state);const before=state.currentDate;
  if(state.phase==='regular'){const gs=gamesOn(state.currentDate).filter(g=>!g.played);gs.forEach(simulateGame);TEAMS.forEach(t=>teamPlayers(t.id).forEach(p=>{if(!p.retired){p.fatigue=Math.max(0,p.fatigue-2);p.form=clamp(p.form+(50-p.form)*.04)}}));
    const user=gs.find(g=>g.home===state.controlTeam||g.away===state.controlTeam);const d=dateObj(state.currentDate);d.setUTCDate(d.getUTCDate()+1);state.currentDate=dateIso(d);if(!state.games.some(g=>!g.played))finishRegularSeason();
    state.lastResult=user?{...user}:null;if(user){state.lastMessage=(user.home===state.controlTeam?(user.homeScore>user.awayScore?'勝利':'敗戦'):(user.awayScore>user.homeScore?'勝利':'敗戦'))+'：'+team(user.away).short+' '+user.awayScore+' - '+user.homeScore+' '+team(user.home).short;renderGame('result');return;}
  }else if(state.phase==='cs'||state.phase==='japan'){advanceSeries();}else{advanceOffseason();return;}
  renderGame('schedule');
};
window.advanceN=function(n){if(!state)return;unlockBGM();n=Math.max(1,Math.min(31,Number(n)||1));if(state.phase!=='regular')return nextDay();for(let i=0;i<n&&state.phase==='regular';i++){processCurrentDay();}state.lastResult=null;state.lastMessage=n+'日分進行しました。';renderGame('schedule')};
window.jumpToDate=function(target){if(!state||state.phase!=='regular')return;if(target<=state.currentDate)return;let guard=0;while(state.currentDate<target&&guard++<200&&state.phase==='regular'){processCurrentDay()}state.lastResult=null;state.lastMessage=fullDate(target)+'まで進めました。';renderGame('schedule')};

/* Enrich old saves at load/start. */
const _renderTitle19=renderTitle;
window.startGame=(function(orig){return function(control){orig(control);ensureV19State(state);state.lastResult=null;state.v19.marketTab='market';state.lastMessage=team(control).name+'でペナントを開始しました。';renderGame('schedule')}})(window.startGame);
const _load19=loadSlot;window.loadSlot=function(slot){_load19(slot);if(state){ensureV19State(state);state.lastResult=null;renderGame('schedule')}};

/* season-end award access from club information */
const _teamInfo19=teamInfoView;
window.teamInfoView=function(){return _teamInfo19()+'<div class="panel" style="margin-top:10px"><div class="panel-head">記録・表彰</div><div class="panel-body actions"><button onclick="safeRender(\'records\')">記録ランキング</button><button onclick="safeRender(\'awards\')">タイトル・表彰</button></div></div>'};

/* Initialize the schema without forcing a rerender during script evaluation. */
if(window.state)ensureV19State(window.state);
})();
</script>

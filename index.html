function teamPlayers(id,includeRetired=false){return state.players.filter(p=>p.teamId===id&&(includeRetired||!p.retired))}function playerById(id){return state?.players?.find(p=>p.id===id)||null}function rating(p){return overall(p)+(p.form-50)*.07-p.fatigue*.08-(p.injury?20:0)}

function teamAttack(id){const ps=lineupFor(id);return ps.reduce((a,p)=>a+p.contact*.38+p.power*.34+p.speed*.09+p.form*.07+p.special.length*.8,0)/Math.max(1,ps.length)}function teamPitch(id){const ps=rotationFor(id);return ps.reduce((a,p)=>a+(p.velocity-120)*.8+p.control*.46+p.stamina*.22+p.form*.05,0)/Math.max(1,ps.length)}function hitRate(p){return clamp01(.18+p.contact*.0022+p.form*.0009)}
function updateHitterStats(id,score){lineupFor(id).forEach(p=>{const pa=3+Math.floor(Math.random()*3);let h=0,hr=0;p.atBats+=pa;for(let j=0;j<pa;j++){if(Math.random()<clamp01(p.power/100*.055)){hr++;h++}else if(Math.random()<hitRate(p))h++}p.hits+=h;p.hr+=hr;p.rbi+=Math.max(0,Math.round(score/9*(Math.random()*.9+.3)));p.avg=p.atBats?p.hits/p.atBats:0;p.career.totalHits=(p.career.totalHits||0)+h;p.career.totalHR=(p.career.totalHR||0)+hr})}
function updatePitchingStats(id,score,opp){const p=rotationFor(id)[0];if(!p)return;const ip=Math.max(4.1,Math.min(8.0,5.1+Math.random()*2.3));p.ip+=ip;p.er+=Math.max(0,score-Math.round(Math.random()*1.3));p.so+=Math.round(ip*(p.velocity-135)/8+Math.random()*2);p.era=p.ip?p.er*9/p.ip:0;if(score>opp)p.wins++}

function finishRegularSeason(){state.phase="cs";state.currentDate=state.year+"-10-05";const cs={series:[],leagueWinners:{}};["セ","パ"].forEach(l=>{const r=standings(l);cs.series.push({league:l,round:"1st",high:r[1].id,low:r[2].id,best:3,w1:0,w2:0,done:false,winner:null},{league:l,round:"final",high:r[0].id,low:null,best:5,w1:0,w2:0,done:false,winner:null})});state.postseason={cs,japan:null,results:[],champion:null};state.lastMessage="レギュラーシーズン終了。クライマックスシリーズへ。"}

function teamPayroll(id){return teamPlayers(id).reduce((a,p)=>a+(p.salary||0),0)}function teamInfoView(){const t=team(state.controlTeam),r=state.teams[state.controlTeam],roster=teamPlayers(t.id),hs=roster.filter(p=>p.pos!=="P").sort((a,b)=>overall(b)-overall(a)).slice(0,5),ps=roster.filter(p=>p.pos==="P").sort((a,b)=>overall(b)-overall(a)).slice(0,5);return '<div class="screen-title"><div><h2>球団情報</h2><small>'+t.name+'</small></div><span class="tag">CLUB INFO</span></div><div class="panel"><div class="club-card"><div class="crest">'+t.league+'</div><div><h2 style="margin:0;color:#173b79">'+t.name+'</h2><div class="small">'+t.city+'　／　'+t.league+'リーグ</div></div><div class="record"><b>'+r.wins+'</b><span>勝</span><b>'+r.losses+'</b><span>敗</span></div></div></div><div class="finance"><div><span class="small">球団資金</span><b>'+r.money.toLocaleString()+'万円</b></div><div><span class="small">年俸総額</span><b>'+teamPayroll(t.id).toLocaleString()+'万円</b></div><div><span class="small">選手総数</span><b>'+roster.length+'人</b></div></div><div class="grid2" style="margin-top:10px"><div class="panel"><div class="panel-head">主力野手</div><div class="panel-body">'+hs.map(p=>'<div class="market-row"><div><b>'+p.name+'</b><span class="small"> '+p.pos+' / '+p.age+'歳</span></div>'+ability(overall(p))+'</div>').join("")+'</div></div><div class="panel"><div class="panel-head">主力投手</div><div class="panel-body">'+ps.map(p=>'<div class="market-row"><div><b>'+p.name+'</b><span class="small"> '+p.role+' / '+p.velocity+'km/h</span></div>'+ability(overall(p))+'</div>').join("")+'</div></div></div><div class="panel" style="margin-top:10px"><div class="panel-head">球団ステータス</div><div class="panel-body"><div class="lines"><div><span>チーム力</span><b>'+Math.round(roster.filter(p=>!p.minor&&!p.retired).sort((a,b)=>overall(b)-overall(a)).slice(0,18).reduce((a,p)=>a+overall(p),0)/18)+'</b></div><div><span>得失点差</span><b>'+(r.runsFor-r.runsAgainst>=0?"+":"")+(r.runsFor-r.runsAgainst)+'</b></div><div><span>一軍</span><b>'+roster.filter(p=>!p.minor&&!p.retired).length+'人</b></div><div><span>二軍</span><b>'+roster.filter(p=>p.minor&&!p.retired).length+'人</b></div></div></div></div>'}
function postseasonView(){if(state.phase==="offseason")return '<div class="screen-title"><div><h2>オフシーズン</h2><small>シーズン終了後の球団運営</small></div><span class="tag">OFF-SEASON</span></div><div class="offseason-grid"><div class="panel"><div class="panel-head">オフ進行</div><div class="panel-body"><div class="step-list">'+["引退・契約整理","FA公示","FA交渉","ドラフト","新年度"].map((x,i)=>'<div class="step '+(state.offseason.step===i?"current":"")+' '+(state.offseason.step>i?"done":"")+'"><b>'+(state.offseason.step>i?"✓":i+1)+'</b><span>'+x+'</span></div>').join("")+'</div><button class="primary" style="margin-top:10px;width:100%" onclick="advanceOffseason()">▶ 次のオフイベントへ</button><button style="margin-top:6px;width:100%" onclick="safeRender(\'newstrength\')">新戦力画面を開く</button></div></div><div class="panel"><div class="panel-head">年度総括</div><div class="panel-body"><div class="stat-grid"><div class="stat-box"><b>'+state.teams[state.controlTeam].wins+'</b><span>レギュラー勝</span></div><div class="stat-box"><b>'+(state.postseason?.champion?team(state.postseason.champion).short:"－")+'</b><span>日本一</span></div><div class="stat-box"><b>'+teamPayroll(state.controlTeam).toLocaleString()+'</b><span>年俸総額</span></div><div class="stat-box"><b>'+state.seasonHistory.length+'</b><span>完走年度</span></div></div><div class="notice" style="margin-top:10px">「新戦力」からドラフト候補を調査し、FA選手を獲得できます。</div></div></div></div>';const p=state.postseason;if(state.phase==="cs")return '<div class="screen-title"><div><h2>クライマックスシリーズ</h2><small>'+state.year+'年度　ポストシーズン</small></div><span class="tag">CS</span></div><div class="grid2"><div class="panel"><div class="panel-head">シリーズ</div><div class="panel-body"><div class="result-banner">'+state.lastMessage+'</div>'+p.cs.series.map(s=>'<div class="market-row"><div><b>'+s.league+'・'+s.round+'</b><div class="small">'+team(s.high).short+(s.low?" vs "+team(s.low).short:"")+'</div></div><b>'+(s.done?s.w1+"-"+s.w2+"　"+team(s.winner).short:"未決着")+'</b></div>').join("")+'<button class="primary" style="margin-top:10px" onclick="nextDay()">▶ シリーズを進める</button></div></div><div class="panel"><div class="panel-head">シリーズ結果</div><div class="panel-body">'+p.results.map(x=>'<div class="market-row"><span>'+x+'</span></div>').join("")+'</div></div></div>';const j=p.japan;return '<div class="screen-title"><div><h2>日本シリーズ</h2><small>'+team(j.high).short+' vs '+team(j.low).short+'</small></div><span class="tag">JAPAN SERIES</span></div><div class="grid2"><div class="panel"><div class="panel-head">日本シリーズ</div><div class="panel-body"><div class="result-banner">'+state.lastMessage+'</div><div class="series-table" style="margin-top:10px">'+Array.from({length:7},(_,i)=>'<div class="series-game">第'+(i+1)+'戦<br>'+(i<j.w1+j.w2?"決着":"－")+'</div>').join("")+'</div><button class="primary" style="margin-top:10px" onclick="nextDay()">▶ 日本シリーズを進める</button></div></div><div class="panel"><div class="panel-head">ここまでの結果</div><div class="panel-body">'+p.results.map(x=>'<div class="market-row"><span>'+x+'</span></div>').join("")+'</div></div></div>'}
function saveView(){let out='<div class="screen-title"><div><h2>セーブ</h2><small>5スロット</small></div><span class="tag">SAVE DATA</span></div><div class="panel"><div class="panel-head">セーブデータ</div><div class="panel-body">';[1,2,3,4,5].forEach(s=>{out+='<div class="market-row"><div><b>セーブ'+s+'</b><div class="small">'+(findSave(s)?"保存済み":"空き")+'</div></div><button onclick="save('+s+')">保存</button></div>'});out+='<div class="actions" style="margin-top:12px"><button class="red" onclick="stopBGM();state=null;renderTitle()">タイトル画面に戻る</button><button onclick="clearSaves()">セーブを確認</button></div></div></div>';return out}
function clearSaves(){alert("セーブデータはブラウザのlocalStorageに保存されています。")}
function renderTitle(){$('app').innerHTML='<div class="title-shell"><div class="title-box"><div class="title-head"><div><div style="font-size:10px">ORIGINAL BROWSER PENNANT</div><h1>ペナントマネージャー</h1><small>球団経営・選手育成・長期ペナント</small></div><div style="text-align:right"><b>∞</b><br><small>YEAR MODE</small></div></div><div class="title-body"><div class="title-menu"><div class="title-buttons"><button class="primary" onclick="newGame()">▶ はじめから</button><button onclick="loadScreen()">▶ つづきから</button></div><div class="title-side"><h3>PENNANT FEATURES</h3><div>・1軍／2軍ロスター</div><div>・能力値 1～100 / S～G</div><div>・日程／順位／采配</div><div>・CS／日本シリーズ</div><div>・FA／ドラフト／育成</div><div>・5スロットセーブ</div></div></div></div></div></div>'}
function newGame(){selectedPlayer=null;renderTeamSelect()}function renderTeamSelect(){let out='<div class="title-shell"><div class="title-box"><div class="title-head"><div><div style="font-size:10px">PENNANT MODE</div><h1>球団を選択</h1></div><div><small>2026 SEASON</small></div></div><div class="title-body"><div class="team-grid">';TEAMS.forEach(t=>{out+='<button class="team-card '+(selectedTeam===t.id?"selected":"")+'" onclick="selectedTeam=\''+t.id+'\';renderTeamSelect()"><span class="small">'+t.league+'リーグ</span><strong>'+t.name+'</strong><div class="team-meta"><span>'+t.city+'</span><span>チーム力 '+TEAM_BASE[t.id]+'</span></div></button>'});out+='</div><div class="actions" style="justify-content:space-between;margin-top:15px"><button onclick="renderTitle()">戻る</button><button class="primary" onclick="startGame()">この球団で開始</button></div></div></div></div>';$('app').innerHTML=out}
function startGame(){try{state=freshState(selectedTeam);ensureSchedule();ensureLineupsAll();bgmUnlocked=true;renderGame("schedule");playBGM()}catch(e){console.error(e);alert("ゲーム開始に失敗しました。"+e.message)}}
function loadScreen(){let out='<div class="title-shell"><div class="title-box"><div class="title-head"><div><div style="font-size:10px">PENNANT DATA</div><h1>つづきから</h1></div></div><div class="title-body">';[1,2,3,4,5].forEach(s=>{const x=findSave(s);let label="空き";if(x){try{const z=JSON.parse(x);label=(z.year||"－")+"年度 / "+(z.currentDate||"")+" / "+(team(z.controlTeam)?.name||"")}catch(e){label="読み込み不可"}}out+='<div class="market-row"><div><b>セーブ'+s+'</b><div class="small">'+label+'</div></div><button '+(x?"":"disabled")+' onclick="loadSlot('+s+')">ロード</button></div>'});out+='<div style="margin-top:12px"><button onclick="renderTitle()">戻る</button></div></div></div></div>';$('app').innerHTML=out}
ensureSchedule();renderTitle();
</script>
</body></html>

"use strict";
const TEAMS=[
{id:"tigers",name:"阪神タイガース",league:"セ",city:"兵庫",power:84},{id:"carp",name:"広島東洋カープ",league:"セ",city:"広島",power:74},{id:"baystars",name:"横浜DeNAベイスターズ",league:"セ",city:"神奈川",power:80},{id:"giants",name:"読売ジャイアンツ",league:"セ",city:"東京",power:82},{id:"swallows",name:"東京ヤクルトスワローズ",league:"セ",city:"東京",power:72},{id:"dragons",name:"中日ドラゴンズ",league:"セ",city:"愛知",power:70},
{id:"hawks",name:"福岡ソフトバンクホークス",league:"パ",city:"福岡",power:86},{id:"fighters",name:"北海道日本ハムファイターズ",league:"パ",city:"北海道",power:81},{id:"marines",name:"千葉ロッテマリーンズ",league:"パ",city:"千葉",power:76},{id:"eagles",name:"東北楽天ゴールデンイーグルス",league:"パ",city:"宮城",power:71},{id:"buffaloes",name:"オリックス・バファローズ",league:"パ",city:"大阪",power:79},{id:"lions",name:"埼玉西武ライオンズ",league:"パ",city:"埼玉",power:68}];
const SAVE_KEY="pennant_manager_next_v6";
const OLD_SAVE_KEY="pennant_manager_next_v5"; const OLD_SAVE_KEY2="pennant_manager_next_v4"; const OLD_SAVE_KEY3="pennant_manager_next_v3"; let state=null,selectedTeam=TEAMS[0].id;
const $=id=>document.getElementById(id),team=id=>TEAMS.find(t=>t.id===id),clone=x=>JSON.parse(JSON.stringify(x));
window.selectedPlayer=null;
function dateStr(dt){const w=["日","月","火","水","木","金","土"];return `${dt.getUTCFullYear()}/${String(dt.getUTCMonth()+1).padStart(2,"0")}/${String(dt.getUTCDate()).padStart(2,"0")}（${w[dt.getUTCDay()]}）`}
function ageAt(birth,year){return year-Number(birth.slice(0,4));}
function clamp100(v){return Math.max(1,Math.min(100,Math.round(v)));}
function rankOf(v){v=clamp100(v);if(v>=90)return "S";if(v>=80)return "A";if(v>=70)return "B";if(v>=60)return "C";if(v>=50)return "D";if(v>=40)return "E";if(v>=20)return "F";return "G";}
function rankClass(v){return "rank-"+rankOf(v).toLowerCase();}
function ability(v){v=clamp100(v);return `<span class="ability ${rankClass(v)}"><b>${rankOf(v)}</b><small>${v}</small></span>`;}
function overall(p){
  if(p.pos==="P") return clamp100((p.velocity-120)*0.9 + p.control*0.35 + p.stamina*0.3 + (p.velocity>=150?8:0));
  return clamp100(p.contact*.27+p.power*.24+p.speed*.13+p.def*.16+p.arm*.10+(p.catching||50)*.10+(p.trajectory||2)*2);
}
const NAMES=["青木","石川","伊藤","井上","岡田","加藤","木村","久保","小川","佐々木","高橋","田中","中村","西村","藤井","松本","森","山口","山田","吉田","渡辺","佐藤","鈴木","山本","小林","斎藤","清水","阿部","池田","後藤","近藤","前田","村上","林","橋本","柴田","原","宮本","横山","長谷川","福田","金子","藤田","岡本","中島","中川","石井","遠藤"];
function makePlayer(id,tm,i,pos){
  let age=20+(i*7+tm.length)%17;
  let seed=(i*17+tm.length*13)%41;
  let base=clamp100(45+seed+(pos==="P"?0:5));
  let contact=clamp100(62+((i*11+tm.length)%30));
  let power=clamp100(48+seed+(i%5)*4);
  let speed=clamp100(45+((i*9+seed)%45));
  let def=clamp100(45+((i*13+seed)%45));
  let arm=clamp100(45+((i*7+seed)%45));
  let catching=clamp100(42+((i*15+seed)%48));

function calcTeamPower(id){
  let roster=state.players.filter(p=>p.teamId===id&&!p.retired&&!p.minor&&!p.injury);
  let hitters=roster.filter(p=>p.pos!=="P").sort((a,b)=>rating(b)-rating(a)).slice(0,9);
  let pitchers=roster.filter(p=>p.pos==="P").sort((a,b)=>rating(b)-rating(a)).slice(0,5);

function simulateGame(g){

  let ar=state.teams[g.away],hr=state.teams[g.home];
  ar.runsFor+=as;ar.runsAgainst+=hs;hr.runsFor+=hs;hr.runsAgainst+=as;
  if(as>hs){ar.wins++;hr.losses++;ar.streak="W";hr.streak="L";}else{hr.wins++;ar.losses++;hr.streak="W";ar.streak="L";}
  let used=state.lineups[g.away]||[],used2=state.lineups[g.home]||[];

}
function recoverAndDevelop(){

  let headers=['日','月','火','水','木','金','土'].map(x=>'<div class="head">'+x+'</div>').join('');
  let todayHtml=today.length?today.map(g=>'<div class="game-card"><div class="game-date">'+g.date+'<br><span class="home-mark">'+(g.home===state.controlTeam?'HOME':g.away===state.controlTeam?'AWAY':'')+'</span></div><div class="game-vs">'+team(g.away).name+'<br>'+team(g.home).name+'</div><div class="game-score">'+(g.played?(g.awayScore+' - '+g.homeScore):'-')+'</div></div>').join(''):'<p class="small" style="padding:16px">試合はありません。</p>';
  let recent=state.games.filter(g=>g.played).slice(-7).reverse().map(g=>'<div class="match"><span>'+g.date+'<br>'+team(g.away).name+' × '+team(g.home).name+'</span><b>'+g.awayScore+' - '+g.homeScore+'</b></div>').join('')||'<p class="small">まだ試合結果はありません。</p>';
  let future=up.slice(0,9).map(g=>'<div class="match"><span class="small">'+g.date+'</span><span>'+team(g.away).name+'<br>vs '+team(g.home).name+'</span></div>').join('');
  let rank=standings(team(state.controlTeam).league).map((x,i)=>'<div class="match"><span>'+ (i+1)+'位　'+x.name+'</span><b>'+x.wins+'勝 '+x.losses+'敗</b></div>').join('');
  return '<div class="schedule-layout"><div><div class="pp-strip"><span>日程・試合</span><span>'+state.year+'年 '+(m+1)+'月</span></div><div class="panel" style="padding:10px;border-top:0;border-radius:0 0 3px 3px"><div class="month-grid">'+headers+cells.join('')+'</div></div><div class="panel" style="margin-top:12px;padding:0"><div class="pp-strip">'+dateStr(new Date(state.currentDate))+'<span class="kbd">今日の試合</span></div>'+todayHtml+'</div><div class="panel" style="margin-top:12px"><h3>最近の試合</h3>'+recent+'</div></div><div class="schedule-right"><div class="panel"><h3>シーズン操作</h3><div class="day-controls"><button class="primary" onclick="advanceDay()">▶ 次の日へ</button><button onclick="nextGame()">▶ 次の試合へ</button><button onclick="state.lastMessage=\'移動日を確認しました。\';renderGame(\'schedule\')">移動日を確認</button></div><div class="subnav"><button onclick="jumpToMonth(6)">オールスター前へ</button><button onclick="jumpToDate(\'2026-10-05\')">CSへ</button></div></div><div class="panel"><h3>今後の日程</h3>'+future+'</div><div class="panel"><h3>現在の順位</h3>'+rank+'</div></div></div>';
}
function jumpToDate(d){state.currentDate=d+"T00:00:00Z";if(state.phase==="regular"&&d>"2026-10-04")completeRegularSeason();renderGame("schedule")}
function jumpToMonth(month){let d=new Date(state.currentDate);d.setUTCMonth(month-1,1);state.currentDate=d.toISOString();state.lastMessage="日程をジャンプしました。";renderGame("schedule")}
function postseasonView(){let title=state.phase==="cs"?"クライマックスシリーズ":state.phase==="japan"?"日本シリーズ":"オフシーズン";if(state.phase==="offseason")return offseasonView();return `<div class="grid2"><div class="panel"><div class="pp-strip"><span>${title}</span><span class="pp-yellow">${dateStr(new Date(state.currentDate))}</span></div><div class="result-banner" style="margin-top:12px">${state.lastMessage}</div><div class="roster-actions" style="margin-top:14px"><button class="primary" onclick="advanceDay()">▶ 次へ進む</button></div></div><div class="panel"><h3>シリーズ結果</h3>${(state.postseason?.results||[]).map(x=>`<div class="match"><span>${x}</span></div>`).join("")||`<p class=small>まだ結果はありません。</p>`}</div></div>`}
function offseasonView(){let steps=["引退","FA","FA獲得","ドラフト","新年度"];return `<div class="offseason-card"><div class="panel"><div class="pp-strip"><span>オフシーズン</span><span>STEP ${state.offseasonStep}/5</span></div><div class="event-list" style="margin-top:12px">${steps.map((x,i)=>`<button class="event-btn ${state.offseasonStep>=i+1?"done":""}" onclick="processOffseason(${i+1});renderGame('schedule')">${state.offseasonStep>=i+1?"✓":"▶"} ${x}</button>`).join("")}</div><div class="notice" style="margin-top:12px">${state.lastMessage}</div></div><div class="panel"><h3>年度総括</h3><div class="statline"><div class="statbox"><b>${team(state.controlTeam).name}</b><span>操作球団</span></div><div class="statbox"><b>${state.teams[state.controlTeam].wins}</b><span>勝利数</span></div><div class="statbox"><b>${state.postseason?.champion?team(state.postseason.champion).name:"-"}</b><span>日本一</span></div><div class="statbox"><b>${teamPayroll(state.controlTeam).toLocaleString()}</b><span>年俸総額</span></div></div><h3 style="margin-top:18px">契約状況</h3>${state.players.filter(p=>p.teamId===state.controlTeam&&!p.retired).sort((a,b)=>b.salary-a.salary).slice(0,8).map(p=>`<div class="market-row"><div>${p.name}<span class=small> ${p.contractYears}年契約</span></div><b class=money>${(p.salary||0).toLocaleString()}万</b></div>`).join("")}</div></div>`}
function showPlayer(id){let p=playerById(id),box=$("playerDetail");if(!box||!p)return;window.selectedPlayer=id;let status=p.injury?`<span class="status-danger">${p.injury} 残${p.injuryDays}日</span>`:`<span class="team-state">${p.minor?"二軍":"一軍"}</span>`;let header=`<div class="detail-title"><div><div class="player-number">${p.number}</div><div><h2 class="classic-title">${p.name}</h2><p>${p.age}歳　${p.pos}　${p.bats}打${p.throws}投　${status}</p></div></div><div class="overall-card rating-xl">${ability(overall(p))}<span>総合</span></div></div>`;let common=`<div class="mini-stats"><div><small>疲労</small><b>${p.fatigue}</b></div><div><small>調子</small><b>${p.form}</b></div><div><small>潜在能力</small><b>${p.potential||"-"}</b></div><div><small>成長タイプ</small><b>${p.development}</b></div></div>`;if(p.pos==="P")box.innerHTML=header+common+`<div class="ability-block"><h3>投手能力</h3><div class="ability-box"><div class="ability-cell"><span>球速</span><b class="raw-stat">${p.velocity}<small>km/h</small></b></div><div class="ability-cell"><span>コントロール</span>${ability(p.control)}</div><div class="ability-cell"><span>スタミナ</span>${ability(p.stamina)}</div><div class="ability-cell"><span>投球タイプ</span><b>${p.role}</b></div></div><div class="special-box"><h3>変化球・特殊能力</h3><div class="special-chips"><span>ストレート</span><span>カーブ</span>${p.special.map(x=>`<span>${x}</span>`).join("")}</div></div></div><h3 class="subhead">今季成績</h3><div class="statline large"><div class="statbox"><b>${p.wins}</b><span>勝利</span></div><div class="statbox"><b>${p.era.toFixed(2)}</b><span>防御率</span></div><div class="statbox"><b>${p.ip.toFixed(1)}</b><span>投球回</span></div><div class="statbox"><b>${p.so}</b><span>奪三振</span></div></div><div class="info-lines" style="margin-top:12px"><div><span>年俸</span><b class="money">${(p.salary||0).toLocaleString()}万円</b></div><div><span>契約年数</span><b>${p.contractYears||1}年</b></div></div>`;else box.innerHTML=header+common+`<div class="ability-block"><h3>野手能力</h3><div class="ability-box"><div class="ability-cell"><span>ミート</span>${ability(p.contact)}</div><div class="ability-cell"><span>パワー</span>${ability(p.power)}</div><div class="ability-cell"><span>走力</span>${ability(p.speed)}</div><div class="ability-cell"><span>肩力</span>${ability(p.arm)}</div><div class="ability-cell"><span>守備力</span>${ability(p.def)}</div><div class="ability-cell"><span>捕球</span>${ability(p.catching)}</div></div><div class="trajectory"><span>弾道</span>${[1,2,3,4].map(x=>`<i class="${x<=p.trajectory?"on":""}"></i>`).join("")}<b>${p.trajectory}</b></div><div class="special-box"><h3>特殊能力</h3><div class="special-chips">${p.special.map(x=>`<span>${x}</span>`).join("")}</div></div></div><h3 class="subhead">今季成績</h3><div class="statline large"><div class="statbox"><b>${p.avg.toFixed(3)}</b><span>打率</span></div><div class="statbox"><b>${p.hits}</b><span>安打</span></div><div class="statbox"><b>${p.hr}</b><span>本塁打</span></div><div class="statbox"><b>${p.rbi}</b><span>打点</span></div></div><div class="info-lines" style="margin-top:12px"><div><span>年俸</span><b class="money">${(p.salary||0).toLocaleString()}万円</b></div><div><span>契約年数</span><b>${p.contractYears||1}年</b></div></div>`}
function lineupView(){let id=state.controlTeam,order=(state.lineups[id]||[]).map(playerById).filter(Boolean),rot=(state.rotation[id]||[]).map(playerById).filter(Boolean);let bench=state.players.filter(p=>p.teamId===id&&p.minor);return `<div class="grid2"><div class="panel"><h3>スターティングラインナップ</h3><ol class=depth-list>${order.map((p,i)=>`<li><b>${i+1}番</b>　${p.name} <span class=pos>${p.pos}</span>　<span class=small>疲${p.fatigue} 調${p.form}</span></li>`).join("")}</ol><div class=roster-actions><button onclick="autoLineup()">自動編成</button></div><h3 style="margin-top:18px">一軍・二軍</h3><p class=small>二軍選手：${bench.length}人</p><div class=roster-actions>${bench.slice(0,8).map(p=>`<button onclick="promote('${p.id}')">${p.name} 一軍昇格</button>`).join("")}</div></div><div class="panel"><h3>先発ローテーション</h3><ol class=depth-list>${rot.map((p,i)=>`<li>${i+1}　${p.name}　${p.velocity}km/h　制球${p.control}　疲${p.fatigue}</li>`).join("")}</ol><div class=roster-actions><button onclick="autoRotation()">自動編成</button></div><h3 style="margin-top:18px">状態管理</h3><p class=small>試合後に疲労が蓄積し、休養日に回復します。調子は日々変動し、怪我は一定確率で発生します。</p></div></div>`}
function promote(id){let p=playerById(id);if(!p||!p.minor)return;let active=state.players.filter(x=>x.teamId===state.controlTeam&&!x.minor&&!x.injury);if(active.length>=28){let target=active.sort((a,b)=>rating(a)-rating(b))[0];target.minor=true;}p.minor=false;autoLineup();state.lastMessage=`${p.name}を一軍に昇格させました。`;renderGame("lineup")}
function autoLineup(){let ps=state.players.filter(p=>p.teamId===state.controlTeam&&!p.minor&&!p.injury&&p.pos!=="P").sort((a,b)=>rating(b)-rating(a));state.lineups[state.controlTeam]=ps.slice(0,9).map(p=>p.id);state.lastMessage="打順を能力・コンディションを考慮して自動編成しました。";renderGame("lineup")}
function autoRotation(){let ps=state.players.filter(p=>p.teamId===state.controlTeam&&!p.minor&&!p.injury&&p.pos==="P").sort((a,b)=>rating(b)-rating(a));state.rotation[state.controlTeam]=ps.slice(0,5).map(p=>p.id);state.lastMessage="先発ローテーションを能力・コンディションを考慮して自動編成しました。";renderGame("lineup")}
function standingsView(){let row=(x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td class=num>${x.wins}</td><td class=num>${x.losses}</td><td class=num>${x.ties}</td><td class=num>${x.runsFor-x.runsAgainst>0?"+":""}${x.runsFor-x.runsAgainst}</td></tr>`;return `<div class=grid2><div class=panel><h3>セ・リーグ</h3><table><thead><tr><th>順位</th><th>球団</th><th class=num>勝</th><th class=num>敗</th><th class=num>分</th><th class=num>得失</th></tr></thead><tbody>${standings("セ").map(row).join("")}</tbody></table></div><div class=panel><h3>パ・リーグ</h3><table><thead><tr><th>順位</th><th>球団</th><th class=num>勝</th><th class=num>敗</th><th class=num>分</th><th class=num>得失</th></tr></thead><tbody>${standings("パ").map(row).join("")}</tbody></table></div></div>`}
function newStrengthView(){
  let own=state.players.filter(p=>p.teamId===state.controlTeam&&p.minor).sort((a,b)=>overall(b)-overall(a)).slice(0,6);
  let market=state.players.filter(p=>p.teamId!==state.controlTeam).sort((a,b)=>overall(b)-overall(a)).slice(0,6);
  return `<div class="grid2"><div class="panel"><div class="section-head"><div><h2>新戦力</h2><small>補強候補・若手チェック</small></div><span class="system-tag">SCOUTING</span></div><h3>自軍 二軍注目選手</h3>${own.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${p.pos} / ${p.age}歳 / ${p.development}</span></div><div>${ability(overall(p))}</div></div>`).join("")||`<p class="small">候補選手はいません。</p>`}</div><div class="panel"><div class="section-head"><div><h2>他球団チェック</h2><small>現在は情報確認用</small></div></div>${market.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${team(p.teamId).name} / ${p.pos} / ${p.age}歳</span></div><div>${ability(overall(p))}</div></div>`).join("")}<div class="notice mini-notice">トレード・FA・ドラフト獲得はオフシーズン機能として順次実装します。</div></div></div>`;
}
function teamInfoView(){
  let t=team(state.controlTeam),rec=state.teams[state.controlTeam],roster=state.players.filter(p=>p.teamId===state.controlTeam),active=roster.filter(p=>!p.minor&&!p.retired),minor=roster.filter(p=>p.minor);
  let hitters=roster.filter(p=>p.pos!=="P").sort((a,b)=>overall(b)-overall(a)).slice(0,3),pitchers=roster.filter(p=>p.pos==="P").sort((a,b)=>overall(b)-overall(a)).slice(0,3);
  return `<div class="team-info-grid"><div class="panel club-card"><div class="club-crest">${t.league}</div><div><h2>${t.name}</h2><p>${t.city}　／　${t.league}リーグ</p></div><div class="club-record"><b>${rec.wins}</b><span>勝</span><b>${rec.losses}</b><span>敗</span></div></div><div class="mini-grid four"><div class="statbox"><b>${active.length}</b><span>一軍人数</span></div><div class="statbox"><b>${minor.length}</b><span>二軍人数</span></div><div class="statbox"><b>${Math.round(calcTeamPower(state.controlTeam))}</b><span>チーム力</span></div><div class="statbox"><b>${rec.runsFor-rec.runsAgainst>=0?"+":""}${rec.runsFor-rec.runsAgainst}</b><span>得失点</span></div></div><div class="grid2"><div class="panel"><h3>主力野手</h3>${hitters.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${p.pos}</span></div>${ability(overall(p))}</div>`).join("")}</div><div class="panel"><h3>主力投手</h3>${pitchers.map(p=>`<div class="market-row"><div><b>${p.name}</b><span class="small"> ${p.role} / ${p.velocity}km/h</span></div>${ability(overall(p))}</div>`).join("")}</div></div><div class="panel"><h3>球団運営</h3><div class="info-lines"><div><span>球団方針</span><b>戦力均衡・育成重視</b></div><div><span>本拠地</span><b>${t.city}</b></div><div><span>選手総数</span><b>${roster.length}人</b></div><div><span>シーズン成績</span><b>${rec.wins}勝 ${rec.losses}敗 ${rec.ties}分</b></div></div></div></div>`;
}

function saveView(){return `<div class=panel><h3>セーブデータ</h3>${[1,2,3,4,5].map(s=>`<div class=match><span>セーブ${s}　${localStorage.getItem(SAVE_KEY+s)?"保存済み":"空き"}</span><button onclick="save(${s})">保存</button></div>`).join("")}<div class=actions style="margin-top:16px"><button class=danger onclick="if(confirm('タイトル画面に戻りますか？')){state=null;renderTitle()}">タイトル画面に戻る</button></div></div>`}
renderTitle();
</script>
</body>
</html>
